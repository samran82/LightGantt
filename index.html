<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LightGantt</title>
<style>
:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --surface2: #0f3460;
  --accent: #e94560;
  --accent2: #533483;
  --text: #eee;
  --text2: #aaa;
  --border: #2a2a4a;
  --row-hover: rgba(233,69,96,0.07);
  --today: rgba(233,69,96,0.18);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* Toolbar */
.toolbar { display:flex; align-items:center; gap:10px; padding:8px 16px; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; flex-wrap: wrap; }
.title-block { display:flex; flex-direction:column; align-items:flex-start; gap:6px; margin-right:auto; }
.toolbar h1 { font-size:18px; font-weight:700; color:var(--accent); }
.toolbar button, .toolbar select { background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 14px; cursor:pointer; font-size:13px; transition: background .2s; }
.toolbar button:hover, .toolbar select:hover { background:var(--accent2); }
.toolbar .btn-add { background:var(--accent); border-color:var(--accent); font-weight:600; }
.toolbar .btn-add:hover { background:#c73a52; }
/* Settings gear menu */
.settings-menu { position:relative; }
.settings-menu .settings-dropdown { display:none; position:absolute; top:calc(100% + 6px); right:0; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:8px; box-shadow:0 8px 24px rgba(0,0,0,.45); z-index:300; min-width:210px; flex-direction:column; gap:6px; }
.settings-menu.open .settings-dropdown { display:flex; }
.settings-dropdown button { width:100%; text-align:left; justify-content:flex-start; padding:7px 12px; border-radius:6px; font-size:13px; }
.settings-dropdown .color-row { display:flex; align-items:center; gap:8px; padding:7px 12px; color:var(--text); font-size:13px; border-radius:6px; cursor:pointer; border:none; background:none; width:100%; transition:background .15s; }
.settings-dropdown .color-row:hover { background:rgba(255,255,255,0.06); }
.settings-dropdown .color-row input[type=color] { width:24px; height:24px; border:1px solid var(--border); border-radius:4px; cursor:pointer; background:none; padding:0; pointer-events:none; flex-shrink:0; }
.settings-dropdown .sep { height:1px; background:var(--border); margin:2px 0; }
.filter-row { display:flex; align-items:center; gap:8px; }
.filter-label { font-size:11px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.5px; white-space:nowrap; }
.filter-chip { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.filter-chip .filter-btn { background:rgba(255,255,255,0.06); border:1px solid var(--border); color:var(--text2); border-radius:999px; padding:4px 10px; font-size:12px; cursor:pointer; transition:all .15s; }
.filter-chip .filter-btn:hover { background:rgba(255,255,255,0.12); color:var(--text); }
.filter-chip .filter-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
/* Custom autocomplete */
.ac-dropdown { position:fixed; z-index:500; background:var(--surface2); border:1px solid var(--border); border-radius:6px; box-shadow:0 8px 24px rgba(0,0,0,.4); overflow-y:auto; max-height:180px; }
.ac-option { padding:7px 12px; font-size:13px; color:var(--text); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ac-option:hover { background:var(--row-hover); color:#fff; }

/* Main layout */
.main { display:flex; flex:1; overflow:hidden; }

/* Task list panel */
.task-panel { width:340px; min-width:260px; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; }
.task-panel-header { display:grid; grid-template-columns: 40px 1fr 90px 90px; align-items:center; min-height:56px; padding:0 6px; font-size:12px; font-weight:600; color:var(--text2); border-bottom:1px solid var(--border); text-transform:uppercase; letter-spacing:.5px; }
.task-list { flex:1; overflow-y:auto; }
.task-group-row { display:flex; align-items:center; height:36px; padding:0 10px; border-bottom:1px solid var(--border); background:rgba(255,255,255,0.04); color:var(--text); font-size:12px; font-weight:700; letter-spacing:.3px; text-transform:uppercase; }
.task-group-row span:last-child { margin-left:auto; color:var(--text2); font-weight:600; }
.task-row { display:grid; grid-template-columns: 40px 1fr 90px 90px; align-items:center; height:36px; padding:0 6px; border-bottom:1px solid var(--border); cursor:pointer; transition: background .15s, box-shadow .18s, opacity .18s, transform .24s cubic-bezier(.22,1,.36,1); font-size:13px; }
.task-row:hover { background:var(--row-hover); }
.task-row.selected { background: rgba(83,52,131,0.3); }
.task-row.dragging { opacity:.45; }
.task-row.reorder-animating { position:relative; z-index:1; }
.task-row.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
.task-row.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
.task-row .task-color { width:14px; height:14px; border-radius:3px; justify-self:center; }
.task-meta { display:flex; align-items:center; gap:6px; overflow:hidden; }
.task-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.task-badge { flex-shrink:0; padding:2px 6px; border-radius:999px; background:rgba(255,255,255,0.08); color:var(--text2); font-size:10px; font-weight:700; text-transform:uppercase; }
.task-row input { background:transparent; border:none; color:var(--text); font-size:13px; width:100%; outline:none; }
.task-row input:focus { border-bottom:1px solid var(--accent); }
.task-row .task-date { font-size:12px; color:var(--text2); text-align:center; }

/* Gantt panel */
.gantt-panel { flex:1; overflow:auto; position:relative; }
.gantt-header { position:sticky; top:0; z-index:10; background:var(--surface); border-bottom:1px solid var(--border); }
.gantt-header-row { display:flex; height:28px; }
.gantt-header-cell { flex-shrink:0; text-align:center; font-size:11px; color:var(--text2); border-right:1px solid var(--border); display:flex; align-items:center; justify-content:center; }
.gantt-header-cell.weekend { background: rgba(255,255,255,0.03); }
.gantt-header-cell.today { background: var(--today); color: var(--accent); font-weight:700; }
.gantt-body { position:relative; }
.gantt-group-row { display:flex; align-items:center; height:36px; padding:0 12px; border-bottom:1px solid var(--border); background:rgba(255,255,255,0.04); color:var(--text2); font-size:12px; font-weight:700; letter-spacing:.3px; text-transform:uppercase; }
.gantt-row { display:flex; height:36px; border-bottom:1px solid var(--border); position:relative; }
.gantt-cell { flex-shrink:0; border-right:1px solid rgba(255,255,255,0.03); }
.gantt-cell.weekend { background: rgba(255,255,255,0.02); }
.gantt-cell.today { background: var(--today); }
.dependency-layer { position:absolute; top:0; left:0; z-index:3; overflow:visible; pointer-events:none; }
.dependency-path { fill:none; stroke:rgba(255,200,50,0.9); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.gantt-bar-container { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
.gantt-bar { position:absolute; height:22px; top:7px; border-radius:5px; cursor:default; pointer-events:all; display:flex; align-items:center; gap:6px; padding:0 8px 0 24px; font-size:11px; font-weight:600; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.4); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition: filter .15s, transform .18s cubic-bezier(.22,1,.36,1); min-width: 6px; }
.gantt-bar:hover { filter:brightness(1.2); }
.gantt-bar.dragging-time { filter:brightness(1.15); box-shadow:0 10px 24px rgba(0,0,0,.28); cursor:grabbing; }
.gantt-bar.dragging-reorder { filter:brightness(1.12); box-shadow:0 12px 28px rgba(0,0,0,.3); cursor:ns-resize; }
.gantt-bar.reorder-animating { z-index:4; }
.gantt-bar .bar-progress { position:absolute; left:0; top:0; height:100%; border-radius:5px; background:rgba(255,255,255,0.2); pointer-events:none; }
.gantt-bar .bar-remaining-days { position:absolute; top:2px; height:18px; padding:0 6px; border-radius:10px; background:rgba(0,0,0,0.38); border:1px solid rgba(255,255,255,0.24); color:#fff; font-size:10px; font-weight:700; line-height:18px; text-shadow:none; white-space:nowrap; pointer-events:none; z-index:3; transform:translateX(-50%); }
.gantt-bar .reorder-handle { position:absolute; left:6px; top:4px; bottom:4px; width:12px; border-radius:4px; background:rgba(255,255,255,0.14); cursor:ns-resize; display:flex; align-items:center; justify-content:center; font-size:9px; letter-spacing:-1px; color:rgba(255,255,255,0.9); text-shadow:none; z-index:2; }
.gantt-bar .reorder-handle:hover { background:rgba(255,255,255,0.24); }
.gantt-bar .resize-handle { position:absolute; top:0; width:8px; height:100%; cursor:col-resize; pointer-events:all; }
.gantt-bar .resize-handle.left { left:0; }
.gantt-bar .resize-handle.right { right:0; }
.today-line { position:absolute; top:0; bottom:0; width:2px; background:var(--accent); z-index:5; pointer-events:none; }
/* Link-drag dependency handle */
.bar-link-handle { position:absolute; top:-8px; right:-7px; width:14px; height:14px; border-radius:50%; background:var(--accent); border:2px solid #fff; cursor:crosshair; pointer-events:all; opacity:0; transition:opacity .15s; z-index:10; box-shadow:0 2px 4px rgba(0,0,0,.5); }
.gantt-bar:hover .bar-link-handle { opacity:1; }
.gantt-bar.link-target { outline:2px solid #ffd166; outline-offset:2px; filter:brightness(1.35); }

/* Bar extension date fin */
.bar-extension { position:absolute; top:0; height:100%; background:var(--extension-color, #ff3333); border-radius:0 5px 5px 0; pointer-events:none; z-index:1; opacity:0.9; overflow:hidden; }
.bar-extension-progress { position:absolute; top:0; bottom:0; left:0; background:repeating-linear-gradient(-45deg, rgba(255,255,255,0.75) 0 4px, rgba(255,255,255,0.35) 4px 8px); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.35); }
/* Jalons Gantt */
.milestone-marker { position:absolute; width:14px; height:14px; background:#ffd166; transform:rotate(45deg); pointer-events:all; cursor:ew-resize; z-index:6; border:1px solid rgba(0,0,0,0.5); box-shadow:0 2px 6px rgba(0,0,0,0.4); }
.milestone-marker:hover { filter:brightness(1.45); }
/* Modal jalons */
.milestone-row { display:grid; grid-template-columns:130px 1fr 28px; gap:6px; align-items:center; margin-bottom:6px; }
.milestone-row input { margin:0; }
.btn-remove-milestone { background:rgba(107,26,26,0.7); border:1px solid #6b1a1a; color:#fff; border-radius:4px; cursor:pointer; font-size:16px; padding:0; height:34px; width:28px; }
.btn-remove-milestone:hover { background:#6b1a1a; }
.btn-add-milestone { background:rgba(255,255,255,0.07); border:1px solid var(--border); color:var(--text2); border-radius:6px; padding:6px 12px; cursor:pointer; font-size:12px; margin-top:4px; display:block; }
.btn-add-milestone:hover { background:rgba(255,255,255,0.12); color:var(--text); }

/* Modal */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:100; display:none; align-items:center; justify-content:center; }
.modal-overlay.active { display:flex; }
.modal { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:24px; width:480px; max-width:92vw; max-height:88vh; overflow-y:auto; }
.modal h2 { font-size:16px; margin-bottom:16px; color:var(--accent); }
.modal label { display:block; font-size:13px; color:var(--text2); margin:10px 0 4px; }
.modal input, .modal select, .modal textarea { width:100%; padding:8px 10px; background:var(--bg); border:1px solid var(--border); border-radius:6px; color:var(--text); font-size:13px; outline:none; }
.modal select[multiple] { min-height:110px; }
.modal input:focus, .modal select:focus { border-color:var(--accent); }
.modal-row-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:10px; }
.modal-row-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:10px; }
.modal-row-3 > div, .modal-row-4 > div { display:flex; flex-direction:column; }
.modal-row-3 label, .modal-row-4 label { margin-top:0!important; }
.dependencies-actions { display:flex; justify-content:flex-end; margin-top:6px; }
.btn-clear-deps { background:rgba(255,255,255,0.07); border:1px solid var(--border); color:var(--text2); border-radius:6px; padding:6px 10px; cursor:pointer; font-size:12px; }
.btn-clear-deps:hover { background:rgba(255,255,255,0.12); color:var(--text); }
.modal .modal-actions { display:flex; gap:10px; margin-top:20px; justify-content:flex-end; }
.modal .modal-actions button { padding:8px 18px; border-radius:6px; border:1px solid var(--border); cursor:pointer; font-size:13px; }
.modal .btn-save { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
.modal .btn-cancel { background:var(--surface2); color:var(--text); }
.modal .btn-delete { background:#6b1a1a; color:#fff; border-color:#6b1a1a; margin-right:auto; }

/* Color picker row */
.color-options { display:flex; gap:8px; margin-top:6px; }
.color-opt { width:28px; height:28px; border-radius:6px; cursor:pointer; border:2px solid transparent; transition: border-color .15s, transform .15s; }
.color-opt:hover, .color-opt.active { border-color:#fff; transform:scale(1.15); }

/* Scrollbar */
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
::-webkit-scrollbar-thumb:hover { background:var(--accent2); }

/* Progress slider */
.progress-container { display:flex; align-items:center; gap:10px; }
.progress-container input[type=range] { flex:1; accent-color:var(--accent); }
.progress-container span { font-size:13px; min-width:36px; }

/* Add task footer */
.task-panel-footer { border-top:1px solid var(--border); flex-shrink:0; background:rgba(255,255,255,0.02); }
.task-panel-footer .footer-toggle-btn { display:flex; width:100%; padding:9px 14px; background:none; border:none; color:var(--text2); font-size:13px; cursor:pointer; gap:8px; align-items:center; transition:background .15s, color .15s; text-align:left; }
.task-panel-footer .footer-toggle-btn:hover { background:rgba(255,255,255,0.05); color:var(--text); }
.task-panel-footer .footer-toggle-btn .toggle-icon { font-size:18px; color:var(--accent); line-height:1; font-weight:700; }
.task-panel-footer.collapsed .footer-form { display:none; }
.task-panel-footer:not(.collapsed) .footer-toggle-btn { display:none; }
.task-panel-footer .footer-form { display:grid; grid-template-columns: 40px repeat(6, minmax(0, 1fr)); gap:6px; align-items:center; padding:10px 8px; }
.task-panel-footer input { width:100%; min-width:0; height:30px; padding:0 8px; background:var(--bg); border:1px solid var(--border); border-radius:6px; color:var(--text); font-size:12px; outline:none; }
.task-panel-footer input:focus { border-color:var(--accent); }
.task-panel-footer .inline-add-button { width:30px; height:30px; border:none; border-radius:6px; background:var(--accent); color:#fff; font-size:18px; line-height:1; cursor:pointer; transition: filter .15s, transform .15s; }
.task-panel-footer .inline-add-button:hover { filter:brightness(1.08); transform:translateY(-1px); }
.task-panel-footer .inline-add-button:active { transform:translateY(0); }
.task-panel-footer .inline-add-button { grid-column: 1; grid-row: 2 / span 3; align-self:stretch; height:auto; }
.task-panel-footer .line1-task { grid-column: 2 / span 2; grid-row: 2; }
.task-panel-footer .line1-start { grid-column: 4 / span 2; grid-row: 2; }
.task-panel-footer .line1-end { grid-column: 6 / span 2; grid-row: 2; }
.task-panel-footer .line2-application { grid-column: 2 / span 3; grid-row: 3; }
.task-panel-footer .line2-cc { grid-column: 5 / span 3; grid-row: 3; }
.task-panel-footer .line3-porteur { grid-column: 2 / span 4; grid-row: 4; }
.task-panel-footer .line3-etp { grid-column: 6 / span 2; grid-row: 4; }
.task-panel-footer .footer-form-header { grid-column: 1 / -1; display:flex; justify-content:space-between; align-items:center; margin-bottom:2px; }
.task-panel-footer .footer-form-header span { font-size:12px; font-weight:600; color:var(--text2); text-transform:uppercase; letter-spacing:.5px; }
.task-panel-footer .footer-collapse-btn { background:none; border:none; color:var(--text2); font-size:16px; cursor:pointer; padding:2px 6px; border-radius:4px; line-height:1; transition:background .15s, color .15s; }
.task-panel-footer .footer-collapse-btn:hover { background:rgba(255,255,255,0.08); color:var(--text); }

@media (max-width: 980px) {
  .main { flex-direction:column; }
  .task-panel { width:100%; min-width:0; max-height:45vh; border-right:none; border-bottom:1px solid var(--border); }
  .gantt-panel { min-height:0; }
}

@media (max-width: 760px) {
  .toolbar { padding:8px 10px; gap:8px; }
  .title-block { width:100%; }
  .task-panel-footer .footer-form { grid-template-columns: 36px repeat(2, minmax(0, 1fr)); }
  .task-panel-footer .inline-add-button { width:32px; grid-column:1; grid-row:2 / span 6; }
  .task-panel-footer .line1-task { grid-column:2 / span 2; grid-row:2; }
  .task-panel-footer .line1-start { grid-column:2 / span 2; grid-row:3; }
  .task-panel-footer .line1-end { grid-column:2 / span 2; grid-row:4; }
  .task-panel-footer .line2-application { grid-column:2 / span 2; grid-row:5; }
  .task-panel-footer .line2-cc { grid-column:2 / span 2; grid-row:6; }
  .task-panel-footer .line3-porteur { grid-column:2 / span 2; grid-row:7; }
  .task-panel-footer .line3-etp { grid-column:2 / span 2; grid-row:8; }
  .modal-row-3 { grid-template-columns:1fr 1fr; }
  .modal-row-4 { grid-template-columns:1fr 1fr; }
  .modal { width:96vw; padding:14px; max-height:90vh; border-radius:10px; }
  .modal h2 { margin-bottom:12px; }
  .modal .modal-actions { position:sticky; bottom:-14px; background:var(--surface); padding-top:10px; }
}

/* Tooltip */
.task-tooltip { position:fixed; z-index:200; max-width:320px; padding:10px 12px; background:rgba(15,52,96,0.96); border:1px solid var(--border); border-radius:8px; box-shadow:0 8px 20px rgba(0,0,0,.35); color:var(--text); font-size:12px; line-height:1.35; pointer-events:none; opacity:0; transform:translateY(4px); transition:opacity .12s, transform .12s; }
.task-tooltip.visible { opacity:1; transform:translateY(0); }
.task-tooltip .tt-title { font-size:13px; font-weight:700; color:#fff; margin-bottom:6px; }
.task-tooltip .tt-line { color:var(--text2); margin-bottom:3px; }
.task-tooltip .tt-line strong { color:var(--text); font-weight:700; }
</style>
</head>
<body>

<!-- Toolbar -->
<div class="toolbar">
  <div class="title-block">
    <h1>LightGantt</h1>
    <div class="filter-row"><span class="filter-label">CC:</span><div class="filter-chip" id="ccFilterButtons"></div></div>
    <div class="filter-row"><span class="filter-label">Team:</span><div class="filter-chip" id="teamFilterButtons"></div></div>
  </div>
  <select id="zoomLevel" onchange="changeZoom(this.value)">
    <option value="day">Jour</option>
    <option value="week" selected>Semaine</option>
    <option value="month">Mois</option>
  </select>
  <button class="btn-add" onclick="openModal(null)">+ Nouvelle tâche</button>
  <button onclick="goToToday()">Aujourd'hui</button>
  <div class="settings-menu" id="settingsMenu">
    <button onclick="toggleSettingsMenu()" title="Paramètres">&#9881;</button>
    <div class="settings-dropdown">
      <button onclick="exportJSON();toggleSettingsMenu()">⬇ Export JSON</button>
      <button onclick="document.getElementById('importInput').click();toggleSettingsMenu()">⬆ Import JSON</button>
      <input type="file" id="importInput" accept=".json" style="display:none" onchange="importJSON(event)">
      <div class="sep"></div>
      <label class="color-row" for="extensionColorPicker">Couleur extension
        <input type="color" id="extensionColorPicker" value="#ff3333" onchange="setExtensionColor(this.value)" style="margin-left:auto;">
      </label>
    </div>
  </div>
</div>

<!-- Main -->
<div class="main">
  <!-- Task List -->
  <div class="task-panel">
    <div class="task-panel-header">
      <span></span><span>Tâche</span><span>Début</span><span>Fin</span>
    </div>
    <div class="task-list" id="taskList" ondragover="onTaskListDragOver(event)" ondrop="dropTaskAtEnd(event)"></div>
    <div class="task-panel-footer collapsed" id="taskPanelFooter">
      <button class="footer-toggle-btn" onclick="toggleInlineForm()"><span class="toggle-icon">+</span> Nouvelle tâche rapide</button>
      <div class="footer-form">
        <div class="footer-form-header">
          <span>Nouvelle tâche rapide</span>
          <button class="footer-collapse-btn" onclick="toggleInlineForm()" title="Réduire">✕</button>
        </div>
        <button class="inline-add-button" onclick="createInlineTask()" aria-label="Ajouter une tâche">+</button>
        <input class="line1-task" type="text" id="inlineTaskName" placeholder="Nouvelle tâche">
        <input class="line1-start" type="date" id="inlineTaskStart">
        <input class="line1-end" type="date" id="inlineTaskEnd">
        <input class="line2-application" type="text" id="inlineTaskApplication" placeholder="Team RS/TL" data-ac="application">
        <input class="line2-cc" type="text" id="inlineTaskCc" placeholder="CC" data-ac="cc">
        <input class="line3-porteur" type="text" id="inlineTaskPorteur" placeholder="Lead" data-ac="porteur">
        <input class="line3-etp" type="number" id="inlineTaskEtp" placeholder="ETP" min="0" step="0.1">
      </div>
    </div>
  </div>
  <!-- Gantt Chart -->
  <div class="gantt-panel" id="ganttPanel">
    <div class="gantt-header" id="ganttHeader"></div>
    <div class="gantt-body" id="ganttBody"></div>
  </div>
</div>

<div id="acDropdown" class="ac-dropdown" style="display:none"></div>

<!-- Link-drag SVG overlay -->
<svg id="linkDragSvg" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:150;display:none">
  <defs>
    <marker id="linkArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(255,200,50,0.95)"></path>
    </marker>
  </defs>
  <line id="linkDragLine" stroke="rgba(255,200,50,0.9)" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#linkArrow)" x1="0" y1="0" x2="0" y2="0"/>
</svg>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Nouvelle tâche</h2>
    <input type="hidden" id="taskId">
    <label>Nom</label>
    <input type="text" id="taskName" placeholder="Nom de la tâche">
    <div class="modal-row-3">
      <div><label>Début</label><input type="date" id="taskStart"></div>
      <div><label>Fin</label><input type="date" id="taskEnd"></div>
      <div><label>Progression</label>
        <div class="progress-container">
          <input type="range" id="taskProgress" min="0" max="100" value="0" oninput="document.getElementById('progressVal').textContent=this.value+'%'">
          <span id="progressVal">0%</span>
        </div>
      </div>
    </div>
    <label>Jalons</label>
    <div id="milestoneList"></div>
    <button type="button" class="btn-add-milestone" onclick="addMilestoneRow()">+ Ajouter un jalon</button>
    <div class="modal-row-4">
      <div><label>Team RS/TL</label><input type="text" id="taskApplication" placeholder="Team RS/TL" data-ac="application" oninput="renderDependencySelect(null)"></div>
      <div><label>CC</label><input type="text" id="taskCc" placeholder="CC" data-ac="cc"></div>
      <div><label>Lead</label><input type="text" id="taskPorteur" placeholder="Lead" data-ac="porteur"></div>
      <div><label>ETP</label><input type="number" id="taskEtp" min="0" step="0.1" placeholder="Ex: 0.5"></div>
    </div>
    <label>Dépendances</label>
    <select id="taskDependencies" multiple></select>
    <div class="dependencies-actions">
      <button type="button" class="btn-clear-deps" onclick="clearDependencySelection()">Désélectionner</button>
    </div>
    <label>Couleur</label>
    <div class="color-options" id="colorOptions"></div>
    <div class="modal-actions">
      <button class="btn-delete" id="btnDelete" onclick="deleteTask()" style="display:none">Supprimer</button>
      <button class="btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn-save" onclick="saveTask()">Enregistrer</button>
    </div>
  </div>
</div>

<div id="taskTooltip" class="task-tooltip"></div>

<script>
// ── State ──
const COLORS = ['#e94560','#533483','#0f3460','#00b4d8','#06d6a0','#ffd166','#ef476f','#118ab2','#073b4c','#8338ec'];
const ZOOM = { day: 40, week: 18, month: 5 };
const ROW_HEIGHT = 36;
let tasks = [];
let zoomMode = 'week';
let cellWidth = ZOOM[zoomMode];
let dragState = null;
let milestoneDragState = null;
let linkDragState = null;
let reorderState = null;
let pendingBarAnimation = null;
let ccFilters = new Set();
let teamFilters = new Set();
let tooltipTaskId = null;
let acCurrentInput = null;
let extensionColor = '#ff3333';

// ── Persistence ──
function loadTasks() {
  try { tasks = JSON.parse(localStorage.getItem('lightgantt_tasks') || '[]'); } catch { tasks = []; }
  if (!tasks.length) {
    const today = new Date();
    const d = (off) => { const t = new Date(today); t.setDate(t.getDate()+off); return fmt(t); };
    tasks = [
      { id: uid(), name:'Conception', application:'Portail Client', cc:'DEV', start:d(-5), end:d(2), progress:80, color:COLORS[0], dependencies:[] },
      { id: uid(), name:'Développement', application:'Portail Client', cc:'DEV', start:d(0), end:d(14), progress:30, color:COLORS[3], dependencies:[] },
      { id: uid(), name:'Tests', application:'Portail Client', cc:'QA', start:d(10), end:d(20), progress:0, color:COLORS[4], dependencies:[] },
      { id: uid(), name:'Déploiement', application:'Back Office', cc:'OPS', start:d(18), end:d(25), progress:0, color:COLORS[7], dependencies:[] },
    ];
    saveTasks();
  }
  tasks = tasks.map(normalizeTask);
  repairDependencies();
}
function saveTasks() { localStorage.setItem('lightgantt_tasks', JSON.stringify(tasks)); }
function toggleInlineForm() {
  document.getElementById('taskPanelFooter').classList.toggle('collapsed');
}
function toggleSettingsMenu() {
  document.getElementById('settingsMenu').classList.toggle('open');
}
document.addEventListener('click', function(e) {
  const menu = document.getElementById('settingsMenu');
  if (menu && !menu.contains(e.target)) menu.classList.remove('open');
});
function loadExtensionColor() { 
  const saved = localStorage.getItem('lightgantt_extensionColor');
  if (saved) extensionColor = saved;
  document.getElementById('extensionColorPicker').value = extensionColor;
  document.documentElement.style.setProperty('--extension-color', extensionColor);
}
function saveExtensionColor(color) { localStorage.setItem('lightgantt_extensionColor', color); }
function setExtensionColor(color) {
  extensionColor = color;
  saveExtensionColor(color);
  document.documentElement.style.setProperty('--extension-color', color);
  render();
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmt(d) { return d.toISOString().split('T')[0]; }
function parseDate(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }

function normalizeTask(task) {
  const parsedEtp = task.etp === '' || task.etp === null || task.etp === undefined ? null : parseFloat(task.etp);
  return {
    id: task.id || uid(),
    name: task.name || 'Tâche sans nom',
    application: (task.application || 'Sans application').trim() || 'Sans application',
    cc: (task.cc || '').trim(),
    porteur: (task.porteur || '').trim(),
    etp: Number.isFinite(parsedEtp) ? parsedEtp : null,
    start: task.start,
    end: task.end,
    plannedEnd: task.plannedEnd || task.end,
    progress: Number.isFinite(task.progress) ? task.progress : parseInt(task.progress || 0, 10) || 0,
    color: task.color || COLORS[0],
    dependencies: Array.isArray(task.dependencies) ? [...new Set(task.dependencies.filter(Boolean))] : [],
    milestones: Array.isArray(task.milestones) ? task.milestones.map(m => ({ id: m.id || uid(), name: (m.name||'').trim(), date: m.date||'' })).filter(m => m.date && m.name) : [],
  };
}

function repairDependencies() {
  const ids = new Set(tasks.map(task => task.id));
  tasks.forEach(task => {
    task.dependencies = task.dependencies.filter(depId => depId !== task.id && ids.has(depId));
  });
}

function getVisibleTasks() {
  return tasks.filter(task => {
    const ccOk = ccFilters.size === 0 || ccFilters.has(task.cc || 'Sans CC');
    const teamOk = teamFilters.size === 0 || teamFilters.has(task.application || 'Sans application');
    return ccOk && teamOk;
  });
}

function getGroupedVisibleRows() {
  const visibleTasks = getVisibleTasks();
  const groups = new Map();

  visibleTasks.forEach(task => {
    const key = task.application || 'Sans application';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(task);
  });

  return [...groups.keys()].sort((a, b) => a.localeCompare(b, 'fr')).flatMap(application => {
    const appTasks = groups.get(application);
    return [
      { type: 'group', application, count: appTasks.length },
      ...appTasks.map(task => ({ type: 'task', task })),
    ];
  });
}

function getVisibleTaskIndexMap() {
  const map = new Map();
  getGroupedVisibleRows().forEach((row, index) => {
    if (row.type === 'task') map.set(row.task.id, index);
  });
  return map;
}

// ── Filters ──
function syncFilterRow(containerId, getValue, fallback, filterSet, allLabel, onToggle) {
  const container = document.getElementById(containerId);
  const values = [...new Set(tasks.map(t => getValue(t) || fallback))].sort((a, b) => a.localeCompare(b, 'fr'));
  // Prune stale active filters
  const pruned = new Set([...filterSet].filter(v => values.includes(v)));
  filterSet.clear(); pruned.forEach(v => filterSet.add(v));
  container.innerHTML = ['all', ...values].map(value => {
    const label = value === 'all' ? allLabel : value;
    const active = value === 'all' ? (filterSet.size === 0 ? ' active' : '') : (filterSet.has(value) ? ' active' : '');
    return `<button class="filter-btn${active}" data-value="${escapeHtml(value)}" onclick="${onToggle}(this.dataset.value)">${escapeHtml(label)}</button>`;
  }).join('');
}

function toggleFilter(filterSet, value) {
  if (value === 'all') { filterSet.clear(); }
  else if (filterSet.has(value)) { filterSet.delete(value); }
  else { filterSet.add(value); }
  render();
}

function changeTeamFilter(value) { toggleFilter(teamFilters, value); }
function changeCcFilter(value)   { toggleFilter(ccFilters,   value); }

// ── Autocomplete ──
const AC_FIELDS = {
  application: t => t.application,
  cc:          t => t.cc,
  porteur:     t => t.porteur,
};
function acGetOptions(type) {
  const getter = AC_FIELDS[type];
  if (!getter) return [];
  return [...new Set(tasks.map(getter).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'fr'));
}

function acShow(input) {
  const type = input.dataset.ac;
  if (!type) return;
  const val = input.value.toLowerCase().trim();
  const opts = acGetOptions(type).filter(o => !val || o.toLowerCase().includes(val));
  const drop = document.getElementById('acDropdown');
  if (!opts.length) { acHide(); return; }
  const rect = input.getBoundingClientRect();
  drop.style.left = rect.left + 'px';
  drop.style.top = (rect.bottom + 2) + 'px';
  drop.style.width = Math.max(rect.width, 140) + 'px';
  drop.style.display = 'block';
  drop.innerHTML = opts.map(o => `<div class="ac-option" data-val="${escapeHtml(o)}">${escapeHtml(o)}</div>`).join('');
  drop.querySelectorAll('.ac-option').forEach(el => {
    el.addEventListener('mousedown', e => {
      e.preventDefault();
      input.value = el.dataset.val;
      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.dispatchEvent(new Event('change', { bubbles: true }));
      acHide();
    });
  });
  acCurrentInput = input;
}

function acHide() {
  const drop = document.getElementById('acDropdown');
  if (drop) drop.style.display = 'none';
  acCurrentInput = null;
}

document.addEventListener('focusin', e => {
  if (e.target.dataset && e.target.dataset.ac) { acCurrentInput = e.target; acShow(e.target); }
  else if (!e.target.closest('#acDropdown')) acHide();
});
document.addEventListener('input', e => {
  if (e.target.dataset && e.target.dataset.ac) acShow(e.target);
});
document.addEventListener('focusout', e => {
  if (e.target.dataset && e.target.dataset.ac) setTimeout(acHide, 120);
});

function changeCcFilter(value)   { toggleFilter(ccFilters,   value); }

function escapeHtml(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

function sameApplication(taskA, taskB) {
  return taskA && taskB && taskA.application === taskB.application;
}

function getDefaultTaskDates() {
  const start = new Date();
  start.setHours(0,0,0,0);
  const end = new Date(start);
  end.setDate(end.getDate() + 7);
  return { start: fmt(start), end: fmt(end) };
}

function resetInlineTaskForm() {
  const defaults = getDefaultTaskDates();
  document.getElementById('inlineTaskName').value = '';
  document.getElementById('inlineTaskApplication').value = '';
  document.getElementById('inlineTaskCc').value = '';
  document.getElementById('inlineTaskPorteur').value = '';
  document.getElementById('inlineTaskEtp').value = '';
  document.getElementById('inlineTaskStart').value = defaults.start;
  document.getElementById('inlineTaskEnd').value = defaults.end;
}

function createTask(taskData) {
  tasks.push(normalizeTask({
    id: uid(),
    name: taskData.name,
    application: taskData.application,
    cc: taskData.cc,
    porteur: taskData.porteur,
    etp: taskData.etp,
    start: taskData.start,
    end: taskData.end,
    progress: taskData.progress ?? 0,
    color: taskData.color || COLORS[Math.floor(Math.random() * COLORS.length)],
    dependencies: taskData.dependencies || [],
    milestones: taskData.milestones || [],
  }));
  saveTasks();
  render();
}

// ── Timeline range ──
function getRange() {
  const visibleTasks = getVisibleTasks();
  if (!visibleTasks.length) { const t = new Date(); return { start: new Date(t.getFullYear(), t.getMonth(), 1), end: new Date(t.getFullYear(), t.getMonth()+2, 0) }; }
  let min = parseDate(visibleTasks[0].start), max = parseDate(visibleTasks[0].end);
  visibleTasks.forEach(t => { const s=parseDate(t.start), e=parseDate(t.end); if(s<min) min=s; if(e>max) max=e; });
  const pad = zoomMode==='month'? 30 : zoomMode==='week'? 14 : 7;
  min = new Date(min); min.setDate(min.getDate()-pad);
  max = new Date(max); max.setDate(max.getDate()+pad);
  return { start:min, end:max };
}
function daysBetween(a,b) { return Math.round((b-a)/86400000); }

function countWorkingDays(startDate, endDate) {
  if (endDate < startDate) return 0;
  const cur = new Date(startDate);
  cur.setHours(0, 0, 0, 0);
  const end = new Date(endDate);
  end.setHours(0, 0, 0, 0);
  let count = 0;
  while (cur <= end) {
    const day = cur.getDay();
    if (day !== 0 && day !== 6) count++;
    cur.setDate(cur.getDate() + 1);
  }
  return count;
}

// ── Render ──
function render() {
  syncFilterRow('teamFilterButtons', t => t.application, 'Sans application', teamFilters, 'Toutes les Teams', 'changeTeamFilter');
  syncFilterRow('ccFilterButtons',   t => t.cc,          'Sans CC',          ccFilters,   'Tous les CC',      'changeCcFilter');
  renderTaskList();
  renderGantt();
}

function renderTaskList() {
  const el = document.getElementById('taskList');
  const rows = getGroupedVisibleRows();
  el.innerHTML = rows.map(row => {
    if (row.type === 'group') {
      return `<div class="task-group-row"><span>${escapeHtml(row.application)}</span><span>${row.count} tâche${row.count > 1 ? 's' : ''}</span></div>`;
    }

    const task = row.task;
    const ccLabel = task.cc || 'Sans CC';
    return `
      <div class="task-row" draggable="true" ondblclick="openModal('${task.id}')" data-id="${task.id}"
        ondragstart="startTaskReorder(event,'${task.id}')"
        ondragover="onTaskDragOver(event,'${task.id}')"
        ondrop="dropTaskReorder(event,'${task.id}')"
        ondragend="endTaskReorder()">
        <div class="task-color" style="background:${task.color}"></div>
        <div class="task-meta" title="${escapeHtml(task.name)} | ${escapeHtml(task.application)} | ${escapeHtml(ccLabel)}">
          <span class="task-name">${escapeHtml(task.name)}</span>
          <span class="task-badge">${escapeHtml(ccLabel)}</span>
        </div>
        <div class="task-date">${formatShort(task.start)}</div>
        <div class="task-date">${formatShort(task.end)}</div>
      </div>`;
  }).join('');
}

function formatShort(s) { const d=parseDate(s); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}); }

function renderGantt() {
  const range = getRange();
  const days = daysBetween(range.start, range.end) + 1;
  const totalWidth = days * cellWidth;
  const today = new Date(); today.setHours(0,0,0,0);
  const rows = getGroupedVisibleRows();
  const taskIndexMap = getVisibleTaskIndexMap();

  // Header
  const header = document.getElementById('ganttHeader');
  let monthRow = '', dayRow = '';
  let curMonth = -1;
  let monthSpan = 0, monthLabel = '';

  for (let i = 0; i < days; i++) {
    const d = new Date(range.start);
    d.setDate(d.getDate() + i);
    const isWeekend = d.getDay() === 0 || d.getDay() === 6;
    const isToday = d.getTime() === today.getTime();

    if (d.getMonth() !== curMonth) {
      if (curMonth !== -1) monthRow += `<div class="gantt-header-cell" style="width:${monthSpan*cellWidth}px;font-weight:600">${monthLabel}</div>`;
      curMonth = d.getMonth();
      monthLabel = d.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
      monthSpan = 0;
    }
    monthSpan++;

    const cls = ['gantt-header-cell'];
    if (isWeekend) cls.push('weekend');
    if (isToday) cls.push('today');

    let label = '';
    if (zoomMode === 'day' || zoomMode === 'week') label = d.getDate();
    else if (i % 7 === 0) label = d.getDate();

    dayRow += `<div class="${cls.join(' ')}" style="width:${cellWidth}px">${label}</div>`;
  }
  monthRow += `<div class="gantt-header-cell" style="width:${monthSpan*cellWidth}px;font-weight:600">${monthLabel}</div>`;

  header.innerHTML = `<div class="gantt-header-row">${monthRow}</div><div class="gantt-header-row">${dayRow}</div>`;

  // Body
  const body = document.getElementById('ganttBody');
  body.style.width = totalWidth + 'px';
  let html = '';

  // Grid rows
  rows.forEach(row => {
    if (row.type === 'group') {
      html += `<div class="gantt-group-row">${escapeHtml(row.application)}</div>`;
      return;
    }

    let cells = '';
    for (let i = 0; i < days; i++) {
      const d = new Date(range.start); d.setDate(d.getDate()+i);
      const isWeekend = d.getDay()===0||d.getDay()===6;
      const isToday = d.getTime()===today.getTime();
      let cls = 'gantt-cell';
      if (isWeekend) cls += ' weekend';
      if (isToday) cls += ' today';
      cells += `<div class="${cls}" style="width:${cellWidth}px"></div>`;
    }
    html += `<div class="gantt-row" data-id="${row.task.id}">${cells}</div>`;
  });

  // Dependencies
  html += `<svg class="dependency-layer" width="${totalWidth}" height="${rows.length * ROW_HEIGHT}" viewBox="0 0 ${totalWidth} ${rows.length * ROW_HEIGHT}" preserveAspectRatio="none">
    <defs>
      <marker id="depArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(255,200,50,0.95)"></path>
      </marker>
    </defs>
    ${renderDependencyPaths(range, taskIndexMap)}
  </svg>`;

  // Bars overlay
  html += '<div class="gantt-bar-container">';
  rows.forEach((row, idx) => {
    if (row.type !== 'task') return;

    const t = row.task;
    const s = parseDate(t.start), e = parseDate(t.end);
    const left = daysBetween(range.start, s) * cellWidth;
    const width = (daysBetween(s, e) + 1) * cellWidth;
    const top = idx * ROW_HEIGHT + 7;
    let dragClass = '';
    if (dragState && dragState.id === t.id) {
      dragClass = dragState.mode === 'reorder' ? ' dragging-reorder' : (dragState.mode === 'resize-right' || dragState.mode === 'resize-left') ? ' dragging-time' : '';
    }
    const ccLabel = t.cc || 'Sans CC';
    // Extension rouge persistante si end > plannedEnd
    let extensionHtml = '';
    const progressRatio = Math.max(0, Math.min(100, t.progress)) / 100;
    const progressPx = width * progressRatio;
    const plannedEndDate = parseDate(t.plannedEnd || t.end);
    const curEndDate = parseDate(t.end);
    if (curEndDate > plannedEndDate) {
      const origRightX = (daysBetween(range.start, plannedEndDate) + 1) * cellWidth;
      const extLeft = origRightX - left;
      const extWidth = (daysBetween(range.start, curEndDate) + 1) * cellWidth - origRightX;
      if (extWidth > 0) {
        const overlapWidth = Math.max(0, Math.min(progressPx, extLeft + extWidth) - extLeft);
        const progressOverlay = overlapWidth > 0 ? `<div class="bar-extension-progress" style="width:${overlapWidth}px"></div>` : '';
        extensionHtml = `<div class="bar-extension" style="left:${extLeft}px;width:${extWidth}px">${progressOverlay}</div>`;
      }
    }

    let remainingDaysHtml = '';
    const totalDays = daysBetween(s, e) + 1;
    const completedDays = Math.floor(totalDays * progressRatio);
    const nonProgressWidth = width - progressPx;
    if (completedDays < totalDays && nonProgressWidth >= 34) {
      const remainingStart = new Date(s);
      remainingStart.setDate(remainingStart.getDate() + completedDays);
      const remainingWorkDays = countWorkingDays(remainingStart, e);
      if (remainingWorkDays > 0) {
        const label = `${remainingWorkDays} JO`;
        const labelCenter = progressPx + (nonProgressWidth / 2);
        remainingDaysHtml = `<div class="bar-remaining-days" style="left:${labelCenter}px">${label}</div>`;
      }
    }

    html += `<div class="gantt-bar${dragClass}" data-id="${t.id}" style="left:${left}px;top:${top}px;width:${width}px;background:${t.color}"
      onmouseenter="showTaskTooltip(event,'${t.id}')"
      onmousemove="moveTaskTooltip(event)"
      onmouseleave="hideTaskTooltip()"
      ondblclick="openModal('${t.id}')">
      <div class="bar-progress" style="width:${t.progress}%"></div>
      ${remainingDaysHtml}
      <div class="reorder-handle" onmousedown="event.stopPropagation();startDrag(event,'${t.id}','reorder')">::</div>
      <div class="resize-handle left" onmousedown="event.stopPropagation();startDrag(event,'${t.id}','resize-left')"></div>
      <div class="resize-handle right" onmousedown="event.stopPropagation();startDrag(event,'${t.id}','resize-right')"></div>
      <div class="bar-link-handle" onmousedown="event.stopPropagation();startLinkDrag(event,'${t.id}')"></div>
      ${extensionHtml}
      <span style="position:relative;z-index:1">${escapeHtml(t.name)}</span>
    </div>`;
  });
  html += '</div>';

  // Jalons
  rows.forEach((row, idx) => {
    if (row.type !== 'task') return;
    const t = row.task;
    if (!t.milestones || !t.milestones.length) return;
    t.milestones.forEach(m => {
      if (!m.date) return;
      const mLeft = daysBetween(range.start, parseDate(m.date)) * cellWidth + cellWidth / 2 - 7;
      const mTop = idx * ROW_HEIGHT + 24;
      html += `<div class="milestone-marker" style="left:${mLeft}px;top:${mTop}px" data-mname="${escapeHtml(m.name)}" data-mdate="${escapeHtml(m.date)}" onmousedown="startMilestoneDrag(event,'${t.id}','${m.id}')" onmouseenter="showMilestoneTooltip(event,this)" onmousemove="moveTaskTooltip(event)" onmouseleave="hideTaskTooltip()"></div>`;
    });
  });

  // Today line
  const todayOff = daysBetween(range.start, today);
  if (todayOff >= 0 && todayOff <= days) {
    html += `<div class="today-line" style="left:${todayOff*cellWidth + cellWidth/2}px;height:${rows.length * ROW_HEIGHT}px"></div>`;
  }

  body.innerHTML = html;

  if (pendingBarAnimation) {
    animateGanttBarReorder(pendingBarAnimation);
    pendingBarAnimation = null;
  }
}

function renderDependencyPaths(range, taskIndexMap) {
  return getVisibleTasks().flatMap(task => {
    const targetRowIndex = taskIndexMap.get(task.id);
    if (targetRowIndex === undefined) return [];

    return task.dependencies.map(depId => {
      const sourceTask = tasks.find(item => item.id === depId);
      const sourceRowIndex = taskIndexMap.get(depId);
      if (!sourceTask || sourceRowIndex === undefined) return '';

      const sourceEndX = (daysBetween(range.start, parseDate(sourceTask.end)) + 1) * cellWidth;
      const targetStartX = daysBetween(range.start, parseDate(task.start)) * cellWidth;
      const sourceY = sourceRowIndex * ROW_HEIGHT + ROW_HEIGHT / 2;
      const targetY = targetRowIndex * ROW_HEIGHT + ROW_HEIGHT / 2;
      const elbowX = Math.max(sourceEndX + 18, targetStartX - 18);
      return `<path class="dependency-path" marker-end="url(#depArrow)" d="M ${sourceEndX} ${sourceY} H ${elbowX} V ${targetY} H ${targetStartX}"></path>`;
    });
  }).join('');
}

function getTaskById(id) {
  return tasks.find(task => task.id === id) || null;
}

function buildTaskTooltipHtml(task) {
  const ccLabel = task.cc || 'Sans CC';
  const porteurLabel = task.porteur || 'Non renseigné';
  const etpLabel = task.etp === null ? 'Non renseigné' : String(task.etp).replace('.', ',');
  const deps = task.dependencies
    .map(depId => getTaskById(depId))
    .filter(Boolean)
    .map(dep => dep.name);
  const depsLabel = deps.length ? escapeHtml(deps.join(', ')) : 'Aucune';
  return `
    <div class="tt-title">${escapeHtml(task.name)}</div>
    <div class="tt-line"><strong>Team RS/TL:</strong> ${escapeHtml(task.application)}</div>
    <div class="tt-line"><strong>CC:</strong> ${escapeHtml(ccLabel)}</div>
    <div class="tt-line"><strong>Lead:</strong> ${escapeHtml(porteurLabel)}</div>
    <div class="tt-line"><strong>ETP:</strong> ${escapeHtml(etpLabel)}</div>
    <div class="tt-line"><strong>Début:</strong> ${escapeHtml(task.start)}</div>
    <div class="tt-line"><strong>Fin:</strong> ${escapeHtml(task.end)}</div>
    <div class="tt-line"><strong>Progression:</strong> ${task.progress}%</div>
    <div class="tt-line"><strong>Dépendances:</strong> ${depsLabel}</div>
  `;
}

function showTaskTooltip(event, taskId) {
  const task = getTaskById(taskId);
  const tooltip = document.getElementById('taskTooltip');
  if (!task || !tooltip) return;
  tooltipTaskId = taskId;
  tooltip.innerHTML = buildTaskTooltipHtml(task);
  tooltip.classList.add('visible');
  moveTaskTooltip(event);
}

function moveTaskTooltip(event) {
  const tooltip = document.getElementById('taskTooltip');
  if (!tooltip || !tooltipTaskId) return;

  const offset = 14;
  const rect = tooltip.getBoundingClientRect();
  let x = event.clientX + offset;
  let y = event.clientY + offset;

  if (x + rect.width > window.innerWidth - 8) x = event.clientX - rect.width - offset;
  if (y + rect.height > window.innerHeight - 8) y = event.clientY - rect.height - offset;
  if (x < 8) x = 8;
  if (y < 8) y = 8;

  tooltip.style.left = `${x}px`;
  tooltip.style.top = `${y}px`;
}

function hideTaskTooltip() {
  const tooltip = document.getElementById('taskTooltip');
  if (!tooltip) return;
  tooltipTaskId = null;
  tooltip.classList.remove('visible');
}

// ── Drag & Drop ──
function startDrag(e, id, mode) {
  if (mode === 'move') return;
  hideTaskTooltip();
  e.preventDefault();
  const task = tasks.find(t => t.id === id);
  if (!task) return;
  dragState = {
    id,
    mode,
    startX: e.clientX,
    startY: e.clientY,
    origStart: task.start,
    origEnd: task.end,
    origProgress: task.progress,
    origIndex: tasks.findIndex(t => t.id === id),
  };
  document.addEventListener('mousemove', onDrag);
  document.addEventListener('mouseup', endDrag);
  render();
}

function onDrag(e) {
  if (!dragState) return;
  const dx = e.clientX - dragState.startX;
  const dayDelta = Math.round(dx / cellWidth);
  const task = tasks.find(t => t.id === dragState.id);
  if (!task) return;

  const origS = parseDate(dragState.origStart);
  const origE = parseDate(dragState.origEnd);

  if (dragState.mode === 'reorder') {
    reorderTaskFromBarDrag(e.clientY);
  } else if (dragState.mode === 'resize-right') {
    const ne = new Date(origE); ne.setDate(ne.getDate()+dayDelta);
    if (ne >= origS) {
      task.end = fmt(ne);
      // Réévalue la progression : conserve les JO réalisés, recalcule sur la nouvelle durée
      const joTotal = countWorkingDays(origS, ne);
      if (joTotal > 0) {
        const joRealises = Math.round(dragState.origProgress / 100 * countWorkingDays(origS, origE));
        task.progress = Math.min(100, Math.round(joRealises / joTotal * 100));
      }
    }
  } else if (dragState.mode === 'resize-left') {
    const ns = new Date(origS); ns.setDate(ns.getDate()+dayDelta);
    if (ns <= origE) task.start = fmt(ns);
  }
  render();
}

function endDrag() {
  if (dragState) {
    if (dragState.mode === 'resize-right') {
      const task = tasks.find(t => t.id === dragState.id);
      if (task) {
        const delta = daysBetween(parseDate(dragState.origEnd), parseDate(task.end));
        if (delta > 0) cascadeDependentTasks(dragState.id, delta);
      }
    }
    saveTasks();
    dragState = null;
    render();
  }
  document.removeEventListener('mousemove', onDrag);
  document.removeEventListener('mouseup', endDrag);
}

function reorderTaskFromBarDrag(pointerY) {
  if (!dragState || dragState.mode !== 'reorder') return;

  const body = document.getElementById('ganttBody');
  const bodyRect = body.getBoundingClientRect();
  const draggedTask = tasks.find(task => task.id === dragState.id);
  const currentIndex = tasks.findIndex(t => t.id === dragState.id);
  const rows = getGroupedVisibleRows();
  const relativeY = pointerY - bodyRect.top;
  const hoveredRow = rows[Math.max(0, Math.min(rows.length - 1, Math.floor(relativeY / ROW_HEIGHT)))];
  if (!draggedTask || !hoveredRow || hoveredRow.type !== 'task') return;

  const targetTask = hoveredRow.task;
  if (!sameApplication(draggedTask, targetTask)) return;
  const targetIndex = tasks.findIndex(t => t.id === targetTask.id);

  if (targetIndex === currentIndex || currentIndex === -1) return;

  pendingBarAnimation = captureGanttBarPositions();
  const [movingTask] = tasks.splice(currentIndex, 1);
  tasks.splice(targetIndex, 0, movingTask);
}

function captureGanttBarPositions() {
  const positions = new Map();
  document.querySelectorAll('.gantt-bar').forEach(bar => {
    positions.set(bar.dataset.id, bar.getBoundingClientRect().top);
  });
  return positions;
}

function animateGanttBarReorder(previousPositions) {
  document.querySelectorAll('.gantt-bar').forEach(bar => {
    const previousTop = previousPositions.get(bar.dataset.id);
    if (previousTop === undefined) return;

    const newTop = bar.getBoundingClientRect().top;
    const deltaY = previousTop - newTop;
    if (!deltaY) return;

    bar.classList.add('reorder-animating');
    bar.style.transition = 'none';
    bar.style.transform = `translateY(${deltaY}px)`;
    bar.getBoundingClientRect();
    bar.style.transition = '';

    requestAnimationFrame(() => {
      bar.style.transform = 'translateY(0)';
    });

    const cleanup = () => {
      bar.classList.remove('reorder-animating');
      bar.style.transform = '';
      bar.style.transition = '';
      bar.removeEventListener('transitionend', cleanup);
    };

    bar.addEventListener('transitionend', cleanup);
  });
}

// ── Task reorder ──
function startTaskReorder(e, id) {
  reorderState = { draggedId: id, targetId: null, placement: 'after' };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', id);
  requestAnimationFrame(() => {
    const row = document.querySelector(`.task-row[data-id="${id}"]`);
    if (row) row.classList.add('dragging');
  });
}

function onTaskDragOver(e, id) {
  if (!reorderState || reorderState.draggedId === id) return;
  e.preventDefault();

  const row = e.currentTarget;
  const draggedTask = tasks.find(task => task.id === reorderState.draggedId);
  const targetTask = tasks.find(task => task.id === id);
  if (!sameApplication(draggedTask, targetTask)) return;
  const rect = row.getBoundingClientRect();
  const placement = e.clientY < rect.top + rect.height / 2 ? 'before' : 'after';

  reorderState.targetId = id;
  reorderState.placement = placement;
  updateDropIndicators();
}

function onTaskListDragOver(e) {
  if (!reorderState) return;
  e.preventDefault();

  const list = e.currentTarget;
  const lastRow = list.querySelector('.task-row:last-child');
  if (!lastRow) return;

  const draggedTask = tasks.find(task => task.id === reorderState.draggedId);
  const targetTask = tasks.find(task => task.id === lastRow.dataset.id);
  if (!sameApplication(draggedTask, targetTask)) return;

  const rect = lastRow.getBoundingClientRect();
  if (e.clientY >= rect.top + rect.height / 2) {
    reorderState.targetId = lastRow.dataset.id;
    reorderState.placement = 'after';
    updateDropIndicators();
  }
}

function dropTaskReorder(e, id) {
  e.preventDefault();
  if (!reorderState || reorderState.draggedId === id) {
    endTaskReorder();
    return;
  }

  const row = e.currentTarget;
  const rect = row.getBoundingClientRect();
  const placement = e.clientY < rect.top + rect.height / 2 ? 'before' : 'after';
  moveTask(reorderState.draggedId, id, placement);
  endTaskReorder(false);
}

function dropTaskAtEnd(e) {
  if (!reorderState) return;
  e.preventDefault();

  const list = e.currentTarget;
  const lastRow = list.querySelector('.task-row:last-child');
  if (!lastRow || lastRow.dataset.id === reorderState.draggedId) {
    endTaskReorder();
    return;
  }

  moveTask(reorderState.draggedId, lastRow.dataset.id, 'after');
  endTaskReorder(false);
}

function endTaskReorder(clearState = true) {
  document.querySelectorAll('.task-row').forEach(row => {
    row.classList.remove('dragging', 'drop-before', 'drop-after');
  });

  if (clearState) reorderState = null;
}

function updateDropIndicators() {
  document.querySelectorAll('.task-row').forEach(row => {
    row.classList.remove('drop-before', 'drop-after');
    if (!reorderState || row.dataset.id !== reorderState.targetId) return;
    row.classList.add(reorderState.placement === 'before' ? 'drop-before' : 'drop-after');
  });
}

function captureTaskRowPositions() {
  const positions = new Map();
  document.querySelectorAll('.task-row').forEach(row => {
    positions.set(row.dataset.id, row.getBoundingClientRect().top);
  });
  return positions;
}

function animateTaskListReorder(previousPositions) {
  document.querySelectorAll('.task-row').forEach(row => {
    const previousTop = previousPositions.get(row.dataset.id);
    if (previousTop === undefined) return;

    const newTop = row.getBoundingClientRect().top;
    const deltaY = previousTop - newTop;
    if (!deltaY) return;

    row.classList.add('reorder-animating');
    row.style.transition = 'none';
    row.style.transform = `translateY(${deltaY}px)`;
    row.getBoundingClientRect();
    row.style.transition = '';

    requestAnimationFrame(() => {
      row.style.transform = 'translateY(0)';
    });

    const cleanup = () => {
      row.classList.remove('reorder-animating');
      row.style.transform = '';
      row.style.transition = '';
      row.removeEventListener('transitionend', cleanup);
    };

    row.addEventListener('transitionend', cleanup);
  });
}

function moveTask(draggedId, targetId, placement) {
  const fromIndex = tasks.findIndex(t => t.id === draggedId);
  const targetIndex = tasks.findIndex(t => t.id === targetId);
  if (fromIndex === -1 || targetIndex === -1 || fromIndex === targetIndex) return;
  if (!sameApplication(tasks[fromIndex], tasks[targetIndex])) return;

  const previousPositions = captureTaskRowPositions();
  const [draggedTask] = tasks.splice(fromIndex, 1);
  const baseIndex = tasks.findIndex(t => t.id === targetId);
  const insertIndex = placement === 'before' ? baseIndex : baseIndex + 1;
  tasks.splice(insertIndex, 0, draggedTask);
  saveTasks();
  reorderState = null;
  render();
  animateTaskListReorder(previousPositions);
}

// ── Modal ──
function openModal(id) {
  const modal = document.getElementById('modalOverlay');
  const task = id ? tasks.find(t => t.id === id) : null;
  const defaults = getDefaultTaskDates();
  document.getElementById('modalTitle').textContent = task ? 'Modifier la tâche' : 'Nouvelle tâche';
  document.getElementById('taskId').value = task ? task.id : '';
  document.getElementById('taskName').value = task ? task.name : '';
  document.getElementById('taskStart').value = task ? task.start : defaults.start;
  document.getElementById('taskEnd').value = task ? task.end : defaults.end;
  document.getElementById('taskApplication').value = task ? task.application : '';
  document.getElementById('taskCc').value = task ? task.cc : '';
  document.getElementById('taskPorteur').value = task ? task.porteur : '';
  document.getElementById('taskEtp').value = task && task.etp !== null ? task.etp : '';
  document.getElementById('taskProgress').value = task ? task.progress : 0;
  document.getElementById('progressVal').textContent = (task ? task.progress : 0) + '%';
  document.getElementById('btnDelete').style.display = task ? '' : 'none';
  renderDependencySelect(task);
  document.getElementById('milestoneList').innerHTML = '';
  if (task && task.milestones) task.milestones.forEach(m => addMilestoneRow(m.name, m.date));

  const selColor = task ? task.color : COLORS[Math.floor(Math.random()*COLORS.length)];
  document.getElementById('colorOptions').innerHTML = COLORS.map(c =>
    `<div class="color-opt ${c===selColor?'active':''}" style="background:${c}" onclick="pickColor(this,'${c}')"></div>`).join('');
  document.getElementById('colorOptions').dataset.selected = selColor;

  modal.classList.add('active');
  setTimeout(() => document.getElementById('taskName').focus(), 100);
}

function pickColor(el, c) {
  document.querySelectorAll('.color-opt').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('colorOptions').dataset.selected = c;
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

document.getElementById('taskDependencies').addEventListener('mousedown', function(e) {
  if (e.target && e.target.tagName === 'OPTION') {
    e.preventDefault();
    e.target.selected = !e.target.selected;
  }
});

function renderDependencySelect(task) {
  const select = document.getElementById('taskDependencies');
  const selected = task ? new Set(task.dependencies) : new Set([...select.selectedOptions].map(o => o.value));
  const currentId = document.getElementById('taskId').value;
  const currentApp = (document.getElementById('taskApplication').value.trim() || (task ? task.application : '')) || 'Sans application';
  select.innerHTML = tasks
    .filter(item => item.id !== currentId && (item.application || 'Sans application') === currentApp)
    .map(item => `<option value="${item.id}" ${selected.has(item.id) ? 'selected' : ''}>${escapeHtml(item.name)}</option>`)
    .join('');
}

function clearDependencySelection() {
  const select = document.getElementById('taskDependencies');
  [...select.options].forEach(option => { option.selected = false; });
}

function saveTask() {
  const id = document.getElementById('taskId').value;
  const name = document.getElementById('taskName').value.trim();
  const start = document.getElementById('taskStart').value;
  const end = document.getElementById('taskEnd').value;
  const application = document.getElementById('taskApplication').value.trim() || 'Sans application';
  const cc = document.getElementById('taskCc').value.trim();
  const porteur = document.getElementById('taskPorteur').value.trim();
  const etpRaw = document.getElementById('taskEtp').value;
  const etp = etpRaw === '' ? null : parseFloat(etpRaw);
  const progress = parseInt(document.getElementById('taskProgress').value);
  const color = document.getElementById('colorOptions').dataset.selected;
  const dependencies = [...document.getElementById('taskDependencies').selectedOptions].map(option => option.value);
  const milestones = getMilestonesFromModal();

  if (!name) { document.getElementById('taskName').focus(); return; }
  if (!start || !end || parseDate(end) < parseDate(start)) { alert('Dates invalides'); return; }
  if (etp !== null && (!Number.isFinite(etp) || etp < 0)) { alert('ETP invalide'); document.getElementById('taskEtp').focus(); return; }

  if (id) {
    const t = tasks.find(t => t.id === id);
    // Réinitialise plannedEnd si la date de fin a été modifiée explicitement dans la modal
    const newPlannedEnd = (t && t.end !== end) ? end : (t ? t.plannedEnd : end);
    if (t) { Object.assign(t, normalizeTask({ ...t, name, application, cc, porteur, etp, start, end, plannedEnd: newPlannedEnd, progress, color, dependencies, milestones })); }
  } else {
    createTask({ name, application, cc, porteur, etp, start, end, plannedEnd: end, progress, color, dependencies, milestones });
    closeModal();
    return;
  }
  saveTasks();
  closeModal();
  render();
}

function createInlineTask() {
  const nameInput = document.getElementById('inlineTaskName');
  const applicationInput = document.getElementById('inlineTaskApplication');
  const ccInput = document.getElementById('inlineTaskCc');
  const porteurInput = document.getElementById('inlineTaskPorteur');
  const etpInput = document.getElementById('inlineTaskEtp');
  const startInput = document.getElementById('inlineTaskStart');
  const endInput = document.getElementById('inlineTaskEnd');

  const name = nameInput.value.trim();
  const application = applicationInput.value.trim() || 'Sans application';
  const cc = ccInput.value.trim();
  const porteur = porteurInput.value.trim();
  const etp = etpInput.value === '' ? null : parseFloat(etpInput.value);
  const start = startInput.value;
  const end = endInput.value;

  if (!name) {
    nameInput.focus();
    return;
  }

  if (!start || !end || parseDate(end) < parseDate(start)) {
    alert('Dates invalides');
    startInput.focus();
    return;
  }

  if (etp !== null && (!Number.isFinite(etp) || etp < 0)) {
    alert('ETP invalide');
    etpInput.focus();
    return;
  }

  createTask({ name, application, cc, porteur, etp, start, end });
  resetInlineTaskForm();
  nameInput.focus();
}

function deleteTask() {
  const id = document.getElementById('taskId').value;
  if (id && confirm('Supprimer cette tâche ?')) {
    tasks = tasks.filter(t => t.id !== id);
    saveTasks();
    closeModal();
    render();
  }
}

// ── Milestone modal ──
function addMilestoneRow(name = '', date = '') {
  const mid = uid();
  const row = document.createElement('div');
  row.className = 'milestone-row';
  row.dataset.mid = mid;
  row.innerHTML =
    `<input type="date" class="milestone-date" value="${escapeHtml(date)}">` +
    `<input type="text" class="milestone-name" placeholder="Nom du jalon" value="${escapeHtml(name)}">` +
    `<button type="button" class="btn-remove-milestone" onclick="removeMilestoneRow('${mid}')">×</button>`;
  document.getElementById('milestoneList').appendChild(row);
}

function removeMilestoneRow(mid) {
  const row = document.querySelector(`.milestone-row[data-mid="${mid}"]`);
  if (row) row.remove();
}

function getMilestonesFromModal() {
  return [...document.querySelectorAll('#milestoneList .milestone-row')].map(row => ({
    id: row.dataset.mid,
    date: row.querySelector('.milestone-date').value,
    name: row.querySelector('.milestone-name').value.trim(),
  })).filter(m => m.date && m.name);
}

// ── Cascade dépendances ──
function cascadeDependentTasks(rootTaskId, deltaEndDays) {
  if (deltaEndDays <= 0) return;
  const visited = new Set();
  function cascade(taskId) {
    if (visited.has(taskId)) return;
    visited.add(taskId);
    tasks.forEach(task => {
      if (!task.dependencies.includes(taskId)) return;
      const ns = new Date(parseDate(task.start)); ns.setDate(ns.getDate() + deltaEndDays);
      const ne = new Date(parseDate(task.end)); ne.setDate(ne.getDate() + deltaEndDays);
      task.start = fmt(ns);
      task.end = fmt(ne);
      cascade(task.id);
    });
  }
  cascade(rootTaskId);
}

// ── Tooltip jalons ──
function showMilestoneTooltip(event, el) {
  const tooltip = document.getElementById('taskTooltip');
  if (!tooltip) return;
  tooltipTaskId = 'milestone';
  tooltip.innerHTML = `<div class="tt-title">◆ ${escapeHtml(el.dataset.mname || '')}</div><div class="tt-line"><strong>Date:</strong> ${escapeHtml(el.dataset.mdate || '')}</div>`;
  tooltip.classList.add('visible');
  moveTaskTooltip(event);
}

// ── Link-drag (création de dépendance par glisser-déposer) ──
function startLinkDrag(e, fromId) {
  if (dragState || milestoneDragState) return;
  hideTaskTooltip();
  e.preventDefault();
  const fromEl = document.querySelector(`.gantt-bar[data-id="${fromId}"]`);
  if (!fromEl) return;
  linkDragState = { fromId, toId: null };
  const svg = document.getElementById('linkDragSvg');
  svg.style.display = 'block';
  document.addEventListener('mousemove', onLinkDrag);
  document.addEventListener('mouseup', endLinkDrag);
  onLinkDrag(e);
}

function onLinkDrag(e) {
  if (!linkDragState) return;
  const fromEl = document.querySelector(`.gantt-bar[data-id="${linkDragState.fromId}"]`);
  if (!fromEl) return;
  const fromRect = fromEl.getBoundingClientRect();
  const line = document.getElementById('linkDragLine');
  line.setAttribute('x1', fromRect.right);
  line.setAttribute('y1', fromRect.top + fromRect.height / 2);
  line.setAttribute('x2', e.clientX);
  line.setAttribute('y2', e.clientY);

  // Highlight target bar
  document.querySelectorAll('.gantt-bar.link-target').forEach(b => b.classList.remove('link-target'));
  linkDragState.toId = null;
  // Temporarily hide SVG so elementFromPoint finds the bar under it
  const svg = document.getElementById('linkDragSvg');
  svg.style.display = 'none';
  const el = document.elementFromPoint(e.clientX, e.clientY);
  svg.style.display = 'block';
  const bar = el && el.closest('.gantt-bar');
  if (bar && bar.dataset.id && bar.dataset.id !== linkDragState.fromId) {
    const fromTask = tasks.find(t => t.id === linkDragState.fromId);
    const toTask = tasks.find(t => t.id === bar.dataset.id);
    if (fromTask && toTask && fromTask.application === toTask.application) {
      bar.classList.add('link-target');
      linkDragState.toId = bar.dataset.id;
    }
  }
}

function endLinkDrag() {
  document.getElementById('linkDragSvg').style.display = 'none';
  document.querySelectorAll('.gantt-bar.link-target').forEach(b => b.classList.remove('link-target'));
  if (linkDragState && linkDragState.toId) {
    const toTask = tasks.find(t => t.id === linkDragState.toId);
    if (toTask && !toTask.dependencies.includes(linkDragState.fromId)) {
      toTask.dependencies.push(linkDragState.fromId);
      saveTasks();
      render();
    }
  }
  linkDragState = null;
  document.removeEventListener('mousemove', onLinkDrag);
  document.removeEventListener('mouseup', endLinkDrag);
}

function startMilestoneDrag(e, taskId, milestoneId) {
  if (dragState) return;
  hideTaskTooltip();
  e.preventDefault();
  e.stopPropagation();
  const task = tasks.find(t => t.id === taskId);
  const milestone = task && task.milestones ? task.milestones.find(m => m.id === milestoneId) : null;
  if (!task || !milestone) return;
  milestoneDragState = { taskId, milestoneId, originalDate: milestone.date, currentDate: milestone.date };
  document.addEventListener('mousemove', onMilestoneDrag);
  document.addEventListener('mouseup', endMilestoneDrag);
}

function onMilestoneDrag(e) {
  if (!milestoneDragState) return;
  const panel = document.getElementById('ganttPanel');
  const range = getRange();
  const panelRect = panel.getBoundingClientRect();
  const xInContent = e.clientX - panelRect.left + panel.scrollLeft;
  const dayOffset = Math.round((xInContent - (cellWidth / 2)) / cellWidth);
  const newDate = new Date(range.start);
  newDate.setDate(newDate.getDate() + dayOffset);
  const nextDate = fmt(newDate);

  const task = tasks.find(t => t.id === milestoneDragState.taskId);
  const milestone = task && task.milestones ? task.milestones.find(m => m.id === milestoneDragState.milestoneId) : null;
  if (!milestone) return;
  if (milestone.date === nextDate) return;
  milestone.date = nextDate;
  milestoneDragState.currentDate = nextDate;
  render();
}

function endMilestoneDrag() {
  if (milestoneDragState) {
    const changed = milestoneDragState.currentDate !== milestoneDragState.originalDate;
    milestoneDragState = null;
    if (changed) saveTasks();
    render();
  }
  document.removeEventListener('mousemove', onMilestoneDrag);
  document.removeEventListener('mouseup', endMilestoneDrag);
}

// ── Zoom ──
function changeZoom(mode) {
  zoomMode = mode;
  cellWidth = ZOOM[mode];
  render();
}

// ── Export / Import ──
function exportJSON() {
  const blob = new Blob([JSON.stringify(tasks, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'lightgantt_' + fmt(new Date()) + '.json';
  a.click();
}

function importJSON(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      if (Array.isArray(data)) {
        tasks = data.map(normalizeTask);
        repairDependencies();
        saveTasks();
        render();
      }
    } catch { alert('Fichier JSON invalide'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ── Today ──
function goToToday() {
  const range = getRange();
  const today = new Date(); today.setHours(0,0,0,0);
  const off = daysBetween(range.start, today) * cellWidth;
  const panel = document.getElementById('ganttPanel');
  panel.scrollLeft = Math.max(0, off - panel.clientWidth / 2);
}

// ── Keyboard ──
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); hideTaskTooltip(); }
});

['inlineTaskName', 'inlineTaskApplication', 'inlineTaskCc', 'inlineTaskPorteur', 'inlineTaskEtp', 'inlineTaskStart', 'inlineTaskEnd'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      createInlineTask();
    }
  });
});

// ── Sync scroll ──
document.getElementById('ganttPanel').addEventListener('scroll', function() {
  hideTaskTooltip();
  const scrollTop = this.scrollTop;
  document.getElementById('taskList').scrollTop = scrollTop;
});
document.getElementById('taskList').addEventListener('scroll', function() {
  hideTaskTooltip();
  document.getElementById('ganttPanel').scrollTop = this.scrollTop;
});

// ── Init ──
loadTasks();
loadExtensionColor();
resetInlineTaskForm();
render();
goToToday();
</script>
</body>
</html>
