<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LightGantt</title>
<style>
:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --surface2: #0f3460;
  --accent: #e94560;
  --accent2: #533483;
  --text: #eee;
  --text2: #aaa;
  --border: #2a2a4a;
  --row-hover: rgba(233,69,96,0.07);
  --today: rgba(233,69,96,0.18);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* Toolbar */
.toolbar { display:flex; align-items:center; gap:10px; padding:8px 16px; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; flex-wrap:nowrap; }
.title-block { display:flex; flex-direction:column; align-items:flex-start; gap:6px; margin-right:auto; flex:1; min-width:0; }
.toolbar h1 { font-size:18px; font-weight:700; color:var(--accent); }
.toolbar button, .toolbar select { background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 14px; cursor:pointer; font-size:13px; transition: background .2s; }
.toolbar button:hover, .toolbar select:hover { background:var(--accent2); }
.toolbar .btn-add { background:var(--accent); border-color:var(--accent); font-weight:600; }
.toolbar .btn-add:hover { background:#c73a52; }
.quick-actions-rail { display:flex; flex-direction:column; gap:8px; margin-right:4px; }
.qa-btn {
  position:relative;
  width:34px;
  height:34px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--surface2);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:16px;
  line-height:1;
}
.qa-btn:hover { background:var(--accent2); }
.qa-btn.qa-primary { background:var(--accent); border-color:var(--accent); }
.qa-btn.qa-primary:hover { background:#c73a52; }
.qa-btn::after {
  content: attr(data-label);
  position:absolute;
  left:calc(100% + 10px);
  top:50%;
  transform:translateY(-50%);
  background:rgba(0,0,0,0.88);
  color:#fff;
  padding:4px 8px;
  border-radius:6px;
  font-size:12px;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transition:opacity .12s;
  z-index:420;
}
.qa-btn:hover::after,
.settings-menu:hover > .qa-btn::after,
.zoom-menu:hover > .qa-btn::after { opacity:1; }
/* Settings gear menu */
.settings-menu { position:relative; }
.settings-menu .settings-dropdown { display:none; position:absolute; top:calc(100% + 6px); right:0; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:8px; box-shadow:0 8px 24px rgba(0,0,0,.45); z-index:300; min-width:210px; flex-direction:column; gap:6px; }
.settings-menu.open .settings-dropdown { display:flex; }
.quick-actions-rail .settings-menu .settings-dropdown { left:calc(100% + 10px); right:auto; top:0; }
.settings-dropdown button { width:100%; text-align:left; justify-content:flex-start; padding:7px 12px; border-radius:6px; font-size:13px; }
.settings-dropdown .color-row { display:flex; align-items:center; gap:8px; padding:7px 12px; color:var(--text); font-size:13px; border-radius:6px; cursor:pointer; border:none; background:none; width:100%; transition:background .15s; }
.settings-dropdown .color-row:hover { background:rgba(255,255,255,0.06); }
.settings-dropdown .color-row input[type=color] { width:24px; height:24px; border:1px solid var(--border); border-radius:4px; cursor:pointer; background:none; padding:0; pointer-events:none; flex-shrink:0; }
.settings-dropdown .toggle-row { display:flex; align-items:center; gap:10px; padding:7px 12px; color:var(--text); font-size:13px; border-radius:6px; cursor:pointer; user-select:none; transition:background .15s; }
.settings-dropdown .toggle-row:hover { background:rgba(255,255,255,0.06); }
.settings-dropdown .toggle-row input[type=checkbox] { width:15px; height:15px; accent-color:var(--accent); cursor:pointer; }
.settings-dropdown .select-row { display:flex; align-items:center; gap:10px; padding:7px 12px; color:var(--text); font-size:13px; border-radius:6px; }
.settings-dropdown .select-row select { margin-left:auto; width:auto; min-width:130px; padding:6px 10px; }
.settings-dropdown .sep { height:1px; background:var(--border); margin:2px 0; }
.filter-row { display:flex; align-items:center; gap:8px; min-width:0; width:100%; overflow:hidden; }
.filter-label { font-size:11px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.5px; white-space:nowrap; }
.filter-chip { display:flex; align-items:center; gap:6px; flex:1; flex-wrap:nowrap; overflow-x:auto; overflow-y:hidden; min-width:0; }
.filter-chip .filter-btn { background:rgba(255,255,255,0.06); border:1px solid var(--border); color:var(--text2); border-radius:999px; padding:4px 10px; font-size:12px; cursor:pointer; transition:all .15s; }
.filter-chip .filter-btn:hover { background:rgba(255,255,255,0.12); color:var(--text); }
.filter-chip .filter-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
/* Custom autocomplete */
.ac-dropdown { position:fixed; z-index:500; background:var(--surface2); border:1px solid var(--border); border-radius:6px; box-shadow:0 8px 24px rgba(0,0,0,.4); overflow-y:auto; max-height:180px; }
.ac-option { padding:7px 12px; font-size:13px; color:var(--text); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ac-option:hover { background:var(--row-hover); color:#fff; }

/* Main layout */
.main { display:flex; flex:1; overflow:hidden; }

/* Task list panel */
.task-panel { width:340px; min-width:260px; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; }
.zoom-menu { position:relative; }
.zoom-options {
  display:none;
  position:absolute;
  top:0;
  left:calc(100% + 10px);
  min-width:130px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:6px;
  box-shadow:0 8px 24px rgba(0,0,0,.45);
  z-index:300;
}
.zoom-options.open { display:flex; flex-direction:column; gap:6px; }
.zoom-options button { font-size:12px; }
.task-panel-header { display:grid; grid-template-columns: 40px 1fr 90px 90px; align-items:center; min-height:56px; padding:0 6px; font-size:12px; font-weight:600; color:var(--text2); border-bottom:1px solid var(--border); text-transform:uppercase; letter-spacing:.5px; }
.task-list { flex:1; overflow-y:auto; }
.task-group-row { display:flex; align-items:center; height:36px; padding:0 10px; border-bottom:1px solid var(--border); background:rgba(255,255,255,0.04); color:var(--text); font-size:12px; font-weight:700; letter-spacing:.3px; text-transform:uppercase; }
.task-group-row span:last-child { margin-left:auto; color:var(--text2); font-weight:600; }
.task-group-row.clickable { cursor:pointer; user-select:none; }
.task-group-row.clickable:hover { background:rgba(255,255,255,0.08); }
.task-row { display:grid; grid-template-columns: 40px 1fr 90px 90px; align-items:center; height:36px; padding:0 6px; border-bottom:1px solid var(--border); cursor:pointer; transition: background .15s, box-shadow .18s, opacity .18s, transform .24s cubic-bezier(.22,1,.36,1); font-size:13px; }
.task-row:hover { background:var(--row-hover); }
.task-row.selected { background: rgba(83,52,131,0.3); }
.task-row.dragging { opacity:.45; }
.task-row.reorder-animating { position:relative; z-index:1; }
.task-row.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
.task-row.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
.task-row .task-color { width:14px; height:14px; border-radius:3px; justify-self:center; }
.task-meta { display:flex; align-items:center; gap:6px; overflow:hidden; }
.task-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.task-badge { flex-shrink:0; padding:2px 6px; border-radius:999px; background:rgba(255,255,255,0.08); color:var(--text2); font-size:10px; font-weight:700; text-transform:uppercase; }
.task-row input { background:transparent; border:none; color:var(--text); font-size:13px; width:100%; outline:none; }
.task-row input:focus { border-bottom:1px solid var(--accent); }
.task-row .task-date { font-size:12px; color:var(--text2); text-align:center; }

/* Gantt panel */
.gantt-panel { flex:1; overflow:auto; position:relative; }
.gantt-header { position:sticky; top:0; z-index:10; background:var(--surface); border-bottom:1px solid var(--border); }
.gantt-header-row { display:flex; height:28px; }
.gantt-header-cell { flex-shrink:0; text-align:center; font-size:11px; color:var(--text2); border-right:1px solid var(--border); display:flex; align-items:center; justify-content:center; }
.gantt-header-cell.weekend { background: rgba(255,255,255,0.03); }
.gantt-header-cell.today { background: var(--today); color: var(--accent); font-weight:700; }
.gantt-body { position:relative; }
.gantt-group-row { display:flex; align-items:center; height:36px; padding:0 12px; border-bottom:1px solid var(--border); background:rgba(255,255,255,0.04); color:var(--text2); font-size:12px; font-weight:700; letter-spacing:.3px; text-transform:uppercase; position:relative; overflow:hidden; }
.gantt-group-row.gantt-group-release-row { padding:0; }
.gantt-group-label { position:relative; z-index:2; padding:0 12px; color:var(--text2); pointer-events:none; }
.gantt-group-bar {
  position:absolute;
  top:7px;
  z-index:2;
  height:22px;
  border-radius:999px;
  background:linear-gradient(90deg, rgba(83,52,131,0.88), rgba(15,52,96,0.92));
  border:1px solid rgba(255,255,255,0.14);
  box-shadow:0 6px 18px rgba(0,0,0,0.18);
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 12px;
  min-width:96px;
  overflow:hidden;
  pointer-events:auto;
  cursor:pointer;
}
.gantt-group-bar-progress {
  position:absolute;
  top:0;
  left:0;
  bottom:0;
  background:rgba(255,255,255,0.18);
}
.gantt-group-bar-title, .gantt-group-bar-meta { position:relative; z-index:1; text-transform:none; white-space:nowrap; }
.gantt-group-bar-title { color:#fff; font-weight:700; }
.gantt-group-bar-meta { color:rgba(255,255,255,0.72); font-size:10px; margin-left:auto; }
.gantt-group-bar-team { color:rgba(255,255,255,0.58); font-size:10px; margin-left:4px; position:relative; z-index:1; text-transform:none; white-space:nowrap; }
.gantt-group-bar-toggle { color:rgba(255,255,255,0.92); font-weight:700; font-size:12px; width:12px; text-align:center; position:relative; z-index:1; }
.gantt-row { display:flex; height:36px; border-bottom:1px solid var(--border); position:relative; }
.gantt-cell { flex-shrink:0; border-right:1px solid rgba(255,255,255,0.03); }
.gantt-cell.weekend { background: rgba(255,255,255,0.02); }
.gantt-cell.today { background: var(--today); }
.gantt-grid-bg { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
.gantt-grid-col { position:absolute; top:0; height:100%; border-right:1px solid rgba(255,255,255,0.03); }
.gantt-grid-col.weekend { background: rgba(255,255,255,0.02); }
.gantt-grid-col.today { background: var(--today); }
.dependency-layer { position:absolute; top:0; left:0; z-index:3; overflow:visible; pointer-events:none; }
.dependency-path { fill:none; stroke:rgba(255,200,50,0.75); stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.dependency-dot { fill:rgba(255,200,50,0.9); }
.gantt-bar-container { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:4; }
.gantt-bar { position:absolute; height:22px; top:7px; border-radius:5px; cursor:default; pointer-events:all; display:flex; align-items:center; gap:6px; padding:0 8px 0 24px; font-size:11px; font-weight:600; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.4); white-space:nowrap; overflow:visible; transition: filter .15s, transform .18s cubic-bezier(.22,1,.36,1); min-width: 6px; }
.gantt-bar:hover { filter:brightness(1.2); }
.gantt-bar.dragging-time { filter:brightness(1.15); box-shadow:0 10px 24px rgba(0,0,0,.28); cursor:grabbing; }
.gantt-bar.dragging-reorder { filter:brightness(1.12); box-shadow:0 12px 28px rgba(0,0,0,.3); cursor:ns-resize; }
.gantt-bar.reorder-animating { z-index:4; }
.gantt-bar .bar-progress { position:absolute; left:0; top:0; height:100%; border-radius:5px; background:rgba(255,255,255,0.2); pointer-events:none; }
.gantt-bar .bar-remaining-days { position:absolute; top:50%; left:calc(100% + 8px); height:18px; padding:0 6px; border-radius:10px; background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.24); color:#fff; font-size:10px; font-weight:700; line-height:18px; text-shadow:none; white-space:nowrap; pointer-events:none; z-index:3; transform:translateY(-50%); }
.gantt-bar .bar-title { position:relative; z-index:1; display:block; min-width:0; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.gantt-bar .reorder-handle { position:absolute; left:6px; top:4px; bottom:4px; width:12px; border-radius:4px; background:rgba(255,255,255,0.14); cursor:ns-resize; display:flex; align-items:center; justify-content:center; font-size:9px; letter-spacing:-1px; color:rgba(255,255,255,0.9); text-shadow:none; z-index:2; }
.gantt-bar .reorder-handle:hover { background:rgba(255,255,255,0.24); }
.gantt-bar .resize-handle { position:absolute; top:0; width:8px; height:100%; cursor:col-resize; pointer-events:all; }
.gantt-bar .resize-handle.left { left:0; }
.gantt-bar .resize-handle.right { right:0; }
.today-line { position:absolute; top:0; bottom:0; width:2px; background:var(--accent); z-index:5; pointer-events:none; }
/* Link-drag dependency handle */
.bar-link-handle { position:absolute; top:-8px; right:-7px; width:14px; height:14px; border-radius:50%; background:var(--accent); border:2px solid #fff; cursor:crosshair; pointer-events:all; opacity:0; transition:opacity .15s; z-index:10; box-shadow:0 2px 4px rgba(0,0,0,.5); }
.gantt-bar:hover .bar-link-handle { opacity:1; }
.gantt-bar.link-target { outline:2px solid #ffd166; outline-offset:2px; filter:brightness(1.35); }
.gantt-bar.focused-kpi { outline:3px solid var(--accent); outline-offset:2px; filter:brightness(1.25); box-shadow:0 0 12px rgba(233,69,96,0.6); }

/* Bar extension date fin */
.bar-extension { position:absolute; top:0; height:100%; background:var(--extension-color, #ff3333); border-radius:0 5px 5px 0; pointer-events:none; z-index:1; opacity:0.9; overflow:hidden; }
.bar-extension-progress { position:absolute; top:0; bottom:0; left:0; background:repeating-linear-gradient(-45deg, rgba(255,255,255,0.75) 0 4px, rgba(255,255,255,0.35) 4px 8px); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.35); }
/* Jalons Gantt */
.milestone-marker { position:absolute; width:14px; height:14px; background:#ffd166; transform:rotate(45deg); pointer-events:all; cursor:ew-resize; z-index:6; border:1px solid rgba(0,0,0,0.5); box-shadow:0 2px 6px rgba(0,0,0,0.4); }
.milestone-marker:hover { filter:brightness(1.45); }
/* Modal jalons */
.milestone-row { display:grid; grid-template-columns:130px 1fr 28px; gap:6px; align-items:center; margin-bottom:6px; }
.milestone-row input { margin:0; }
.btn-remove-milestone { background:rgba(107,26,26,0.7); border:1px solid #6b1a1a; color:#fff; border-radius:4px; cursor:pointer; font-size:16px; padding:0; height:34px; width:28px; }
.btn-remove-milestone:hover { background:#6b1a1a; }
.btn-add-milestone { background:rgba(255,255,255,0.07); border:1px solid var(--border); color:var(--text2); border-radius:6px; padding:6px 12px; cursor:pointer; font-size:12px; margin-top:4px; display:block; }
.btn-add-milestone:hover { background:rgba(255,255,255,0.12); color:var(--text); }

/* Modal */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:100; display:none; align-items:center; justify-content:center; }
.modal-overlay.active { display:flex; }
.modal { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:24px; width:480px; max-width:92vw; max-height:88vh; overflow-y:auto; }
.modal h2 { font-size:16px; margin-bottom:16px; color:var(--accent); }
.modal label { display:block; font-size:13px; color:var(--text2); margin:10px 0 4px; }
.modal input, .modal select, .modal textarea { width:100%; padding:8px 10px; background:var(--bg); border:1px solid var(--border); border-radius:6px; color:var(--text); font-size:13px; outline:none; }
.modal select[multiple] { min-height:110px; }
.modal input:focus, .modal select:focus { border-color:var(--accent); }
.modal-row-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
.modal-row-2 > div { display:flex; flex-direction:column; }
.modal-row-2 label { margin-top:0!important; }
.modal-row-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:10px; }
.modal-row-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:10px; }
.modal-row-3 > div, .modal-row-4 > div { display:flex; flex-direction:column; }
.modal-row-3 label, .modal-row-4 label { margin-top:0!important; }
.dependencies-actions { display:flex; justify-content:flex-end; margin-top:6px; }
.btn-clear-deps { background:rgba(255,255,255,0.07); border:1px solid var(--border); color:var(--text2); border-radius:6px; padding:6px 10px; cursor:pointer; font-size:12px; }
.btn-clear-deps:hover { background:rgba(255,255,255,0.12); color:var(--text); }
.modal .modal-actions { display:flex; gap:10px; margin-top:20px; justify-content:flex-end; }
.modal .modal-actions button { padding:8px 18px; border-radius:6px; border:1px solid var(--border); cursor:pointer; font-size:13px; }
.modal .btn-save { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
.modal .btn-cancel { background:var(--surface2); color:var(--text); }
.modal .btn-delete { background:#6b1a1a; color:#fff; border-color:#6b1a1a; margin-right:auto; }

/* Color picker row */
.color-options { display:flex; gap:8px; margin-top:6px; }
.color-opt { width:28px; height:28px; border-radius:6px; cursor:pointer; border:2px solid transparent; transition: border-color .15s, transform .15s; }
.color-opt:hover, .color-opt.active { border-color:#fff; transform:scale(1.15); }

/* Scrollbar */
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
::-webkit-scrollbar-thumb:hover { background:var(--accent2); }

/* Progress slider */
.progress-container { display:flex; align-items:center; gap:8px; }
.progress-container input[type=range] { flex:1; accent-color:var(--accent); min-width:0; }
.progress-container span { font-size:13px; min-width:30px; text-align:right; flex-shrink:0; }
.progress-container .progress-jo { width:38px!important; padding:4px 4px; text-align:center; font-size:12px; background:var(--bg); border:1px solid var(--border); border-radius:6px; color:var(--text); flex-shrink:0; }
.progress-container .progress-jo:focus { border-color:var(--accent); outline:none; }
.progress-jo-label { font-size:12px; color:var(--text2); white-space:nowrap; flex-shrink:0; }

@media (max-width: 980px) {
  .main { flex-direction:column; }
  .task-panel { width:100%; min-width:0; max-height:45vh; border-right:none; border-bottom:1px solid var(--border); }
  .gantt-panel { min-height:0; }
}

@media (max-width: 760px) {
  .toolbar { padding:8px 10px; gap:8px; }
  .title-block { width:auto; }
  .quick-actions-rail { gap:6px; }
  .qa-btn { width:30px; height:30px; font-size:14px; }
  .qa-btn::after { display:none; }
  .quick-actions-rail .settings-menu .settings-dropdown,
  .zoom-options { left:0; top:calc(100% + 6px); }
  .modal-row-2 { grid-template-columns:1fr 1fr; }
  .modal-row-3 { grid-template-columns:1fr 1fr; }
  .modal-row-4 { grid-template-columns:1fr 1fr; }
  .modal { width:96vw; padding:14px; max-height:90vh; border-radius:10px; }
  .modal h2 { margin-bottom:12px; }
  .modal .modal-actions { position:sticky; bottom:-14px; background:var(--surface); padding-top:10px; }
}

/* KPI Bar */
.kpi-bar { display:flex; align-items:center; gap:0; padding:0 16px; height:42px; background:var(--surface); border-top:1px solid var(--border); flex-shrink:0; overflow-x:auto; overflow-y:hidden; }
.kpi-bar::-webkit-scrollbar { height:3px; }
.kpi-bar::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
.kpi-item { display:flex; align-items:center; gap:8px; padding:0 18px; border-right:1px solid var(--border); height:100%; white-space:nowrap; flex-shrink:0; }
.kpi-item:first-child { padding-left:0; }
.kpi-item:last-child { border-right:none; }
.kpi-label { font-size:10px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.6px; }
.kpi-value { font-size:15px; font-weight:700; color:var(--text); }
.kpi-value.kpi-red { color:#e94560; }
.kpi-value.kpi-green { color:#06d6a0; }
.kpi-value.kpi-orange { color:#ffd166; }
.kpi-value.kpi-blue { color:#00b4d8; }
.kpi-item.kpi-clickable { cursor:pointer; transition:background .15s; border-radius:6px; }
.kpi-item.kpi-clickable:hover { background:rgba(255,255,255,0.06); }
.kpi-item.kpi-clickable:hover .kpi-label { color:var(--text); }
@media (max-width:760px) { .kpi-bar { height:36px; padding:0 10px; } .kpi-item { padding:0 12px; } .kpi-label { font-size:9px; } .kpi-value { font-size:13px; } }

/* KPI Drill panel */
.kpi-drill-overlay { position:fixed; inset:0; z-index:160; display:none; pointer-events:none; }
.kpi-drill-overlay.active { display:block; }
.kpi-drill-panel { position:absolute; top:0; right:0; width:420px; max-width:96vw; height:100vh; background:var(--surface); border-left:1px solid var(--border); display:flex; flex-direction:column; box-shadow:-8px 0 32px rgba(0,0,0,.4); animation:slideInRight .18s cubic-bezier(.22,1,.36,1); pointer-events:auto; }
@keyframes slideInRight { from { transform:translateX(40px); opacity:0; } to { transform:translateX(0); opacity:1; } }
.kpi-drill-header { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--border); flex-shrink:0; }
.kpi-drill-title { font-size:14px; font-weight:700; color:var(--text); }
.kpi-drill-count { font-size:12px; color:var(--text2); margin-left:6px; font-weight:400; }
.kpi-drill-close { background:none; border:none; color:var(--text2); font-size:20px; cursor:pointer; padding:2px 6px; border-radius:4px; line-height:1; transition:background .15s, color .15s; }
.kpi-drill-close:hover { background:rgba(255,255,255,0.08); color:var(--text); }
.kpi-drill-body { flex:1; overflow-y:auto; padding:8px 0; }
.kpi-drill-row { display:grid; grid-template-columns:10px 1fr auto; align-items:center; gap:10px; padding:9px 16px; border-bottom:1px solid rgba(255,255,255,0.04); cursor:pointer; transition:background .12s; }
.kpi-drill-row:hover { background:var(--row-hover); }
.kpi-drill-dot { width:10px; height:10px; border-radius:3px; flex-shrink:0; }
.kpi-drill-name { font-size:13px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.kpi-drill-meta { font-size:11px; color:var(--text2); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.kpi-drill-right { display:flex; align-items:center; gap:12px; flex-shrink:0; }
.kpi-drill-text { text-align:right; }
.kpi-drill-prog { font-size:12px; font-weight:700; }
.kpi-drill-dates { font-size:10px; color:var(--text2); margin-top:2px; }
.kpi-drill-empty { padding:32px 16px; text-align:center; color:var(--text2); font-size:13px; }

/* Tooltip */
.task-tooltip { position:fixed; z-index:200; max-width:320px; padding:10px 12px; background:rgba(15,52,96,0.96); border:1px solid var(--border); border-radius:8px; box-shadow:0 8px 20px rgba(0,0,0,.35); color:var(--text); font-size:12px; line-height:1.35; pointer-events:none; opacity:0; transform:translateY(4px); transition:opacity .12s, transform .12s; }
.task-tooltip.visible { opacity:1; transform:translateY(0); }
.task-tooltip .tt-title { font-size:13px; font-weight:700; color:#fff; margin-bottom:6px; }
.task-tooltip .tt-line { color:var(--text2); margin-bottom:3px; }
.task-tooltip .tt-line strong { color:var(--text); font-weight:700; }
</style>
</head>
<body>

<!-- Toolbar -->
<div class="toolbar">
  <div class="quick-actions-rail">
    <div class="settings-menu" id="settingsMenu">
      <button class="qa-btn" data-label="Paramètres" title="Paramètres" onclick="toggleSettingsMenu()">⚙</button>
      <div class="settings-dropdown">
        <button onclick="exportJSON();toggleSettingsMenu()">⬇ Export JSON</button>
        <button onclick="document.getElementById('importInput').click();toggleSettingsMenu()">⬆ Import JSON</button>
        <button onclick="generateDemoWorkload();toggleSettingsMenu()">⚡ Générer 10 Teams démo</button>
        <input type="file" id="importInput" accept=".json" style="display:none" onchange="importJSON(event)">
        <div class="sep"></div>
        <label class="toggle-row" for="showRemainingJoToggle">
          <input type="checkbox" id="showRemainingJoToggle" checked onchange="setShowRemainingJo(this.checked)">
          Afficher reste JO
        </label>
        <label class="select-row" for="groupBySelect">
          Regrouper par
          <select id="groupBySelect" onchange="setGroupBy(this.value)">
            <option value="application">Team</option>
            <option value="release">Release</option>
          </select>
        </label>
        <label class="color-row" for="extensionColorPicker">Couleur extension
          <input type="color" id="extensionColorPicker" value="#ff3333" onchange="setExtensionColor(this.value)" style="margin-left:auto;">
        </label>
      </div>
    </div>
    <div class="zoom-menu" id="zoomMenu">
      <button id="zoomToggleBtn" class="qa-btn" data-label="Zoom: Semaine" title="Zoom: Semaine" onclick="toggleZoomMenu()">◫</button>
      <div class="zoom-options" id="zoomOptions">
        <button onclick="setZoomAndClose('day')">Jour</button>
        <button onclick="setZoomAndClose('week')">Semaine</button>
        <button onclick="setZoomAndClose('month')">Mois</button>
      </div>
    </div>
    <button class="qa-btn" data-label="Aujourd'hui" title="Aujourd'hui" onclick="goToToday()">◉</button>
    <button class="qa-btn qa-primary" data-label="Nouvelle tâche" title="Nouvelle tâche" onclick="openModal(null)">+</button>
  </div>
  <div class="title-block">
    <h1>LightGantt</h1>
    <div class="filter-row"><span class="filter-label">CC:</span><div class="filter-chip" id="ccFilterButtons"></div></div>
    <div class="filter-row"><span class="filter-label">Team:</span><div class="filter-chip" id="teamFilterButtons"></div></div>
  </div>

</div>

<!-- Main -->
<div class="main">
  <!-- Task List -->
  <div class="task-panel">
    <div class="task-panel-header">
      <span></span><span>Tâche</span><span>Début</span><span>Fin</span>
    </div>
    <div class="task-list" id="taskList" ondragover="onTaskListDragOver(event)" ondrop="dropTaskAtEnd(event)"></div>
  </div>
  <!-- Gantt Chart -->
  <div class="gantt-panel" id="ganttPanel">
    <div class="gantt-header" id="ganttHeader"></div>
    <div class="gantt-body" id="ganttBody"></div>
  </div>
</div>

<!-- KPI Bar -->
<div class="kpi-bar" id="kpiBar"></div>

<!-- KPI Drill panel -->
<div class="kpi-drill-overlay" id="kpiDrillOverlay">
  <div class="kpi-drill-panel" id="kpiDrillPanel">
    <div class="kpi-drill-header">
      <span><span class="kpi-drill-title" id="kpiDrillTitle"></span><span class="kpi-drill-count" id="kpiDrillCount"></span></span>
      <button class="kpi-drill-close" onclick="closeKpiDrill()" title="Fermer">✕</button>
    </div>
    <div class="kpi-drill-body" id="kpiDrillBody"></div>
  </div>
</div>

<div id="acDropdown" class="ac-dropdown" style="display:none"></div>

<!-- Link-drag SVG overlay -->
<svg id="linkDragSvg" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:150;display:none">
  <defs>
    <marker id="linkArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(255,200,50,0.95)"></path>
    </marker>
  </defs>
  <line id="linkDragLine" stroke="rgba(255,200,50,0.9)" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#linkArrow)" x1="0" y1="0" x2="0" y2="0"/>
</svg>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Nouvelle tâche</h2>
    <input type="hidden" id="taskId">
    <label>Nom</label>
    <input type="text" id="taskName" placeholder="Nom de la tâche">
    <div class="modal-row-2">
      <div><label>Début</label><input type="date" id="taskStart" oninput="syncProgressJoDays()"></div>
      <div><label>Fin</label><input type="date" id="taskEnd" oninput="syncProgressJoDays()"></div>
    </div>
    <label>Progression</label>
    <div class="progress-container">
      <input type="range" id="taskProgress" min="0" max="100" value="0" oninput="onProgressSliderChange()">
      <span id="progressVal">0%</span>
      <input type="number" id="taskProgressDays" class="progress-jo" min="0" value="0" oninput="onProgressDaysChange()">
      <span class="progress-jo-label">JO</span>
    </div>
    <label>Jalons</label>
    <div id="milestoneList"></div>
    <button type="button" class="btn-add-milestone" onclick="addMilestoneRow()">+ Ajouter un jalon</button>
    <div class="modal-row-2">
      <div><label>Team RS/TL</label><input type="text" id="taskApplication" placeholder="Team RS/TL" data-ac="application" oninput="renderDependencySelect(null)"></div>
      <div><label>Release</label><input type="text" id="taskRelease" placeholder="Release" data-ac="release"></div>
    </div>
    <div class="modal-row-3">
      <div><label>CC</label><input type="text" id="taskCc" placeholder="CC" data-ac="cc"></div>
      <div><label>Lead</label><input type="text" id="taskPorteur" placeholder="Lead" data-ac="porteur"></div>
      <div><label>ETP</label><input type="number" id="taskEtp" min="0" step="0.1" placeholder="Ex: 0.5"></div>
    </div>
    <div class="modal-row-2">
      <div>
        <label>Priorité</label>
        <select id="taskPriority">
          <option value="P0">P0</option>
          <option value="P1">P1</option>
          <option value="P2">P2</option>
          <option value="P3" selected>P3</option>
        </select>
      </div>
      <div>
        <label>Statut</label>
        <input type="text" id="taskStatus" placeholder="Statut" list="statusOptions">
        <datalist id="statusOptions"></datalist>
      </div>
    </div>
    <label>Dépendances</label>
    <select id="taskDependencies" multiple></select>
    <div class="dependencies-actions">
      <button type="button" class="btn-clear-deps" onclick="clearDependencySelection()">Désélectionner</button>
    </div>
    <label>Couleur</label>
    <div class="color-options" id="colorOptions"></div>
    <div class="modal-actions">
      <button class="btn-delete" id="btnDelete" onclick="deleteTask()" style="display:none">Supprimer</button>
      <button class="btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn-save" onclick="saveTask()">Enregistrer</button>
    </div>
  </div>
</div>

<div id="taskTooltip" class="task-tooltip"></div>

<script>
// ── State ──
const COLORS = ['#e94560','#533483','#0f3460','#00b4d8','#06d6a0','#ffd166','#ef476f','#118ab2','#073b4c','#8338ec'];
const ZOOM = { day: 40, week: 18, month: 5 };
const ROW_HEIGHT = 36;
let tasks = [];
let zoomMode = 'week';
let cellWidth = ZOOM[zoomMode];
let dragState = null;
let milestoneDragState = null;
let linkDragState = null;
let reorderState = null;
let pendingBarAnimation = null;
let ccFilters = new Set();
let teamFilters = new Set();
let drillFilterTaskIds = new Set();
let tooltipTaskId = null;
let acCurrentInput = null;
let extensionColor = '#ff3333';
let showRemainingJo = true;
let groupBy = 'application';
let releaseCollapsedGroups = new Set();
let focusedTaskId = null;
let selectedTaskId = null;
const workingDaysCache = new Map();

const GROUP_BY_OPTIONS = {
  application: { label: 'Team', fallback: 'Sans application' },
  release: { label: 'Release', fallback: 'Sans release' },
};

// ── Persistence ──
function loadTasks() {
  try { tasks = JSON.parse(localStorage.getItem('lightgantt_tasks') || '[]'); } catch { tasks = []; }
  if (!tasks.length) {
    const today = new Date();
    const d = (off) => { const t = new Date(today); t.setDate(t.getDate()+off); return fmt(t); };
    tasks = [
      { id: uid(), name:'Conception', application:'Portail Client', release:'R1', cc:'DEV', start:d(-5), end:d(2), progress:80, color:COLORS[0], dependencies:[] },
      { id: uid(), name:'Développement', application:'Portail Client', release:'R1', cc:'DEV', start:d(0), end:d(14), progress:30, color:COLORS[3], dependencies:[] },
      { id: uid(), name:'Tests', application:'Portail Client', release:'R2', cc:'QA', start:d(10), end:d(20), progress:0, color:COLORS[4], dependencies:[] },
      { id: uid(), name:'Déploiement', application:'Back Office', release:'R2', cc:'OPS', start:d(18), end:d(25), progress:0, color:COLORS[7], dependencies:[] },
    ];
    saveTasks();
  }
  tasks = tasks.map(normalizeTask);
  repairDependencies();
}
function saveTasks() { localStorage.setItem('lightgantt_tasks', JSON.stringify(tasks)); }
function toggleSettingsMenu() {
  closeZoomMenu();
  document.getElementById('settingsMenu').classList.toggle('open');
}
function toggleZoomMenu() {
  document.getElementById('settingsMenu').classList.remove('open');
  document.getElementById('zoomOptions').classList.toggle('open');
}
function closeZoomMenu() {
  document.getElementById('zoomOptions').classList.remove('open');
}
function setZoomAndClose(mode) {
  changeZoom(mode);
  closeZoomMenu();
}
function refreshZoomButtonLabel() {
  const labels = { day: 'Jour', week: 'Semaine', month: 'Mois' };
  const zoomBtn = document.getElementById('zoomToggleBtn');
  if (!zoomBtn) return;
  const label = labels[zoomMode] || 'Semaine';
  zoomBtn.setAttribute('data-label', `Zoom: ${label}`);
  zoomBtn.setAttribute('title', `Zoom: ${label}`);
}
document.addEventListener('click', function(e) {
  const menu = document.getElementById('settingsMenu');
  if (menu && !menu.contains(e.target)) menu.classList.remove('open');
  const zoomMenu = document.getElementById('zoomMenu');
  if (zoomMenu && !zoomMenu.contains(e.target)) closeZoomMenu();
});
function loadExtensionColor() { 
  const saved = localStorage.getItem('lightgantt_extensionColor');
  if (saved) extensionColor = saved;
  document.getElementById('extensionColorPicker').value = extensionColor;
  document.documentElement.style.setProperty('--extension-color', extensionColor);
}
function saveExtensionColor(color) { localStorage.setItem('lightgantt_extensionColor', color); }
function loadShowRemainingJo() {
  const saved = localStorage.getItem('lightgantt_showRemainingJo');
  showRemainingJo = saved === null ? true : saved === 'true';
  const toggle = document.getElementById('showRemainingJoToggle');
  if (toggle) toggle.checked = showRemainingJo;
}
function saveShowRemainingJo(value) { localStorage.setItem('lightgantt_showRemainingJo', String(value)); }
function loadGroupBy() {
  const saved = localStorage.getItem('lightgantt_groupBy');
  groupBy = saved === 'release' ? 'release' : 'application';
  const select = document.getElementById('groupBySelect');
  if (select) select.value = groupBy;
}
function saveGroupBy(value) { localStorage.setItem('lightgantt_groupBy', value); }
function loadReleaseCollapsedGroups() {
  try {
    const raw = JSON.parse(localStorage.getItem('lightgantt_releaseCollapsedGroups') || '[]');
    releaseCollapsedGroups = new Set(Array.isArray(raw) ? raw : []);
  } catch {
    releaseCollapsedGroups = new Set();
  }
}
function saveReleaseCollapsedGroups() {
  localStorage.setItem('lightgantt_releaseCollapsedGroups', JSON.stringify([...releaseCollapsedGroups]));
}
function setShowRemainingJo(value) {
  showRemainingJo = !!value;
  saveShowRemainingJo(showRemainingJo);
  render();
}
function setGroupBy(value) {
  groupBy = value === 'release' ? 'release' : 'application';
  saveGroupBy(groupBy);
  render();
}
function isGroupCollapsed(groupKey) {
  return groupBy === 'release' && releaseCollapsedGroups.has(groupKey);
}
function toggleReleaseGroup(encodedGroupKey) {
  if (groupBy !== 'release') return;
  const groupKey = decodeURIComponent(encodedGroupKey || '');
  if (!groupKey) return;
  if (releaseCollapsedGroups.has(groupKey)) releaseCollapsedGroups.delete(groupKey);
  else releaseCollapsedGroups.add(groupKey);
  saveReleaseCollapsedGroups();
  render();
}
function toggleGroupFromList(encodedGroupKey) {
  if (groupBy !== 'release') return;
  toggleReleaseGroup(encodedGroupKey);
}
function setExtensionColor(color) {
  extensionColor = color;
  saveExtensionColor(color);
  document.documentElement.style.setProperty('--extension-color', color);
  render();
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmt(d) { return d.toISOString().split('T')[0]; }
function parseDate(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }

function normalizeTask(task) {
  const parsedEtp = task.etp === '' || task.etp === null || task.etp === undefined ? null : parseFloat(task.etp);
  const rawPriority = String(task.priority || 'P3').toUpperCase();
  const priority = ['P0', 'P1', 'P2', 'P3'].includes(rawPriority) ? rawPriority : 'P3';
  return {
    id: task.id || uid(),
    name: task.name || 'Tâche sans nom',
    application: (task.application || 'Sans application').trim() || 'Sans application',
    release: (task.release || '').trim() || 'Sans release',
    cc: (task.cc || '').trim(),
    porteur: (task.porteur || '').trim(),
    priority,
    status: (task.status || '').trim(),
    etp: Number.isFinite(parsedEtp) ? parsedEtp : null,
    start: task.start,
    end: task.end,
    plannedEnd: task.plannedEnd || task.end,
    progress: Number.isFinite(task.progress) ? task.progress : parseInt(task.progress || 0, 10) || 0,
    color: task.color || COLORS[0],
    dependencies: Array.isArray(task.dependencies) ? [...new Set(task.dependencies.filter(Boolean))] : [],
    milestones: Array.isArray(task.milestones) ? task.milestones.map(m => ({ id: m.id || uid(), name: (m.name||'').trim(), date: m.date||'' })).filter(m => m.date && m.name) : [],
  };
}

function getTaskGroupValue(task) {
  if (groupBy === 'release') {
    const team = (task.application || '').trim() || GROUP_BY_OPTIONS.application.fallback;
    const release = (task.release || '').trim() || GROUP_BY_OPTIONS.release.fallback;
    return `${team}|||${release}`;
  }
  const config = GROUP_BY_OPTIONS.application;
  return (task.application || '').trim() || config.fallback;
}

function getTaskGroupLabelFromKey(key) {
  if (groupBy === 'release') {
    const [team = GROUP_BY_OPTIONS.application.fallback, release = GROUP_BY_OPTIONS.release.fallback] = String(key).split('|||');
    return `${team} • ${release}`;
  }
  return key;
}

function getTaskGroupPartsFromKey(key) {
  if (groupBy === 'release') {
    const [team = GROUP_BY_OPTIONS.application.fallback, release = GROUP_BY_OPTIONS.release.fallback] = String(key).split('|||');
    return { team, release };
  }
  return { team: '', release: '' };
}

function getTaskGroupMeta() {
  return GROUP_BY_OPTIONS[groupBy] || GROUP_BY_OPTIONS.application;
}

function repairDependencies() {
  const ids = new Set(tasks.map(task => task.id));
  tasks.forEach(task => {
    task.dependencies = task.dependencies.filter(depId => depId !== task.id && ids.has(depId));
  });
}

function getVisibleTasks() {
  return tasks.filter(task => {
    // If drill filter is active, only show tasks in the drill list
    if (drillFilterTaskIds.size > 0 && !drillFilterTaskIds.has(task.id)) return false;
    
    const ccOk = ccFilters.size === 0 || ccFilters.has(task.cc || 'Sans CC');
    const teamOk = teamFilters.size === 0 || teamFilters.has(task.application || 'Sans application');
    return ccOk && teamOk;
  });
}

function getGroupedVisibleRows(visibleTasks = getVisibleTasks()) {
  const groups = new Map();

  visibleTasks.forEach(task => {
    const key = getTaskGroupValue(task);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(task);
  });

  return [...groups.keys()].sort((a, b) => a.localeCompare(b, 'fr')).flatMap(groupKey => {
    const groupTasks = groups.get(groupKey);
    const { team, release } = getTaskGroupPartsFromKey(groupKey);
    const collapsed = isGroupCollapsed(groupKey);
    const sortedTasks = [...groupTasks].sort((a, b) => parseDate(a.start) - parseDate(b.start));
    const firstTask = sortedTasks[0];
    const lastTask = [...groupTasks].sort((a, b) => parseDate(b.end) - parseDate(a.end))[0];
    const avgProgress = groupTasks.length ? Math.round(groupTasks.reduce((sum, task) => sum + task.progress, 0) / groupTasks.length) : 0;
    return [
      {
        type: 'group',
        groupKey,
        label: getTaskGroupLabelFromKey(groupKey),
        team,
        release,
        collapsed,
        count: groupTasks.length,
        start: firstTask ? firstTask.start : '',
        end: lastTask ? lastTask.end : '',
        progress: avgProgress,
      },
      ...(collapsed ? [] : groupTasks.map(task => ({ type: 'task', task }))),
    ];
  });
}

function buildGroupSummaryBar(row, range, top) {
  if (groupBy !== 'release' || !row.start || !row.end) return '';
  const start = parseDate(row.start);
  const end = parseDate(row.end);
  const left = daysBetween(range.start, start) * cellWidth;
  const width = Math.max(cellWidth, (daysBetween(start, end) + 1) * cellWidth);
  const progress = Math.max(0, Math.min(100, row.progress || 0));
  const countLabel = `${row.count} tâche${row.count > 1 ? 's' : ''}`;
  const titleLabel = row.release || row.label;
  const teamLabel = row.team || '';
  const toggleGlyph = row.collapsed ? '+' : '-';
  const encodedGroupKey = encodeURIComponent(row.groupKey || '');
  return `<div class="gantt-group-bar" style="left:${left}px;top:${top}px;width:${width}px" onclick="toggleReleaseGroup('${encodedGroupKey}')" title="${row.collapsed ? 'Etendre' : 'Reduire'} le groupe">
    <span class="gantt-group-bar-toggle">${toggleGlyph}</span>
    <div class="gantt-group-bar-progress" style="width:${progress}%"></div>
    <span class="gantt-group-bar-title">${escapeHtml(titleLabel)}</span>
    ${teamLabel ? `<span class="gantt-group-bar-team">${escapeHtml(teamLabel)}</span>` : ''}
    <span class="gantt-group-bar-meta">${countLabel}</span>
  </div>`;
}

function getVisibleTaskIndexMap(rows = getGroupedVisibleRows()) {
  const map = new Map();
  rows.forEach((row, index) => {
    if (row.type === 'task') map.set(row.task.id, index);
  });
  return map;
}

// ── Filters ──
function getFilterSourceTasks(excludedFilter) {
  return tasks.filter(task => {
    if (drillFilterTaskIds.size > 0 && !drillFilterTaskIds.has(task.id)) return false;

    const ccLabel = task.cc || 'Sans CC';
    const teamLabel = task.application || 'Sans application';
    const ccOk = excludedFilter === 'cc' || ccFilters.size === 0 || ccFilters.has(ccLabel);
    const teamOk = excludedFilter === 'team' || teamFilters.size === 0 || teamFilters.has(teamLabel);
    return ccOk && teamOk;
  });
}

function syncFilterRow(containerId, sourceTasks, getValue, fallback, filterSet, allLabel, onToggle) {
  const container = document.getElementById(containerId);
  const values = [...new Set(sourceTasks.map(t => getValue(t) || fallback))].sort((a, b) => a.localeCompare(b, 'fr'));
  // Prune stale active filters
  const pruned = new Set([...filterSet].filter(v => values.includes(v)));
  filterSet.clear(); pruned.forEach(v => filterSet.add(v));
  container.innerHTML = ['all', ...values].map(value => {
    const label = value === 'all' ? allLabel : value;
    const active = value === 'all' ? (filterSet.size === 0 ? ' active' : '') : (filterSet.has(value) ? ' active' : '');
    return `<button class="filter-btn${active}" data-value="${escapeHtml(value)}" onclick="${onToggle}(this.dataset.value)">${escapeHtml(label)}</button>`;
  }).join('');
}

function toggleFilter(filterSet, value) {
  if (value === 'all') { filterSet.clear(); }
  else if (filterSet.has(value)) { filterSet.delete(value); }
  else { filterSet.add(value); }
  render();
}

function changeTeamFilter(value) { toggleFilter(teamFilters, value); }
function changeCcFilter(value)   { toggleFilter(ccFilters,   value); }

// ── Autocomplete ──
const AC_FIELDS = {
  application: t => t.application,
  release:     t => t.release,
  cc:          t => t.cc,
  porteur:     t => t.porteur,
};
function acGetOptions(type) {
  const getter = AC_FIELDS[type];
  if (!getter) return [];
  return [...new Set(tasks.map(getter).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'fr'));
}

function acShow(input) {
  const type = input.dataset.ac;
  if (!type) return;
  const val = input.value.toLowerCase().trim();
  const opts = acGetOptions(type).filter(o => !val || o.toLowerCase().includes(val));
  const drop = document.getElementById('acDropdown');
  if (!opts.length) { acHide(); return; }
  const rect = input.getBoundingClientRect();
  drop.style.left = rect.left + 'px';
  drop.style.top = (rect.bottom + 2) + 'px';
  drop.style.width = Math.max(rect.width, 140) + 'px';
  drop.style.display = 'block';
  drop.innerHTML = opts.map(o => `<div class="ac-option" data-val="${escapeHtml(o)}">${escapeHtml(o)}</div>`).join('');
  drop.querySelectorAll('.ac-option').forEach(el => {
    el.addEventListener('mousedown', e => {
      e.preventDefault();
      input.value = el.dataset.val;
      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.dispatchEvent(new Event('change', { bubbles: true }));
      acHide();
    });
  });
  acCurrentInput = input;
}

function acHide() {
  const drop = document.getElementById('acDropdown');
  if (drop) drop.style.display = 'none';
  acCurrentInput = null;
}

document.addEventListener('focusin', e => {
  if (e.target.dataset && e.target.dataset.ac) { acCurrentInput = e.target; acShow(e.target); }
  else if (!e.target.closest('#acDropdown')) acHide();
});
document.addEventListener('input', e => {
  if (e.target.dataset && e.target.dataset.ac) acShow(e.target);
});
document.addEventListener('focusout', e => {
  if (e.target.dataset && e.target.dataset.ac) setTimeout(acHide, 120);
});

function escapeHtml(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

function sameApplication(taskA, taskB) {
  return taskA && taskB && taskA.application === taskB.application;
}

function sameGroupingBucket(taskA, taskB) {
  return taskA && taskB && getTaskGroupValue(taskA) === getTaskGroupValue(taskB);
}

function getDefaultTaskDates() {
  const start = new Date();
  start.setHours(0,0,0,0);
  const end = new Date(start);
  end.setDate(end.getDate() + 7);
  return { start: fmt(start), end: fmt(end) };
}

function createTask(taskData) {
  tasks.push(normalizeTask({
    id: uid(),
    name: taskData.name,
    application: taskData.application,
    release: taskData.release,
    cc: taskData.cc,
    porteur: taskData.porteur,
    priority: taskData.priority,
    status: taskData.status,
    etp: taskData.etp,
    start: taskData.start,
    end: taskData.end,
    progress: taskData.progress ?? 0,
    color: taskData.color || COLORS[Math.floor(Math.random() * COLORS.length)],
    dependencies: taskData.dependencies || [],
    milestones: taskData.milestones || [],
  }));
  saveTasks();
  render();
}

// ── Timeline range ──
function getRange(visibleTasks = getVisibleTasks()) {
  if (!visibleTasks.length) { const t = new Date(); return { start: new Date(t.getFullYear(), t.getMonth(), 1), end: new Date(t.getFullYear(), t.getMonth()+2, 0) }; }
  let min = parseDate(visibleTasks[0].start), max = parseDate(visibleTasks[0].end);
  visibleTasks.forEach(t => { const s=parseDate(t.start), e=parseDate(t.end); if(s<min) min=s; if(e>max) max=e; });
  const pad = zoomMode==='month'? 30 : zoomMode==='week'? 14 : 7;
  min = new Date(min); min.setDate(min.getDate()-pad);
  max = new Date(max); max.setDate(max.getDate()+pad);
  return { start:min, end:max };
}
function daysBetween(a,b) { return Math.round((b-a)/86400000); }

function countWorkingDays(startDate, endDate) {
  if (endDate < startDate) return 0;
  const cur = new Date(startDate);
  cur.setHours(0, 0, 0, 0);
  const end = new Date(endDate);
  end.setHours(0, 0, 0, 0);
  const cacheKey = `${cur.getTime()}|${end.getTime()}`;
  const cached = workingDaysCache.get(cacheKey);
  if (cached !== undefined) return cached;

  let count = 0;
  while (cur <= end) {
    const day = cur.getDay();
    if (day !== 0 && day !== 6) count++;
    cur.setDate(cur.getDate() + 1);
  }
  if (workingDaysCache.size > 6000) workingDaysCache.clear();
  workingDaysCache.set(cacheKey, count);
  return count;
}

// ── Render ──
function render() {
  const visibleTasks = getVisibleTasks();
  const rows = getGroupedVisibleRows(visibleTasks);
  const taskIndexMap = getVisibleTaskIndexMap(rows);
  const teamFilterSourceTasks = getFilterSourceTasks('team');
  const ccFilterSourceTasks = getFilterSourceTasks('cc');

  syncFilterRow('teamFilterButtons', teamFilterSourceTasks, t => t.application, 'Sans application', teamFilters, 'Toutes les Teams', 'changeTeamFilter');
  syncFilterRow('ccFilterButtons',   ccFilterSourceTasks,   t => t.cc,          'Sans CC',          ccFilters,   'Tous les CC',      'changeCcFilter');
  renderTaskList(rows);
  renderGantt(rows, visibleTasks, taskIndexMap);
  renderKpis(visibleTasks);
}

function renderTaskList(rows) {
  const el = document.getElementById('taskList');
  el.innerHTML = rows.map(row => {
    if (row.type === 'group') {
      const releaseToggle = groupBy === 'release' ? (row.collapsed ? ' [+]' : ' [-]') : '';
      const encodedGroupKey = encodeURIComponent(row.groupKey || '');
      const clickableClass = groupBy === 'release' ? ' clickable' : '';
      const clickHandler = groupBy === 'release' ? ` onclick="toggleGroupFromList('${encodedGroupKey}')"` : '';
      return `<div class="task-group-row${clickableClass}"${clickHandler}><span>${escapeHtml(row.label)}${releaseToggle}</span><span>${row.count} tâche${row.count > 1 ? 's' : ''}</span></div>`;
    }

    const task = row.task;
    const ccLabel = task.cc || 'Sans CC';
    const releaseLabel = task.release || 'Sans release';
    const selectedClass = selectedTaskId === task.id ? ' selected' : '';
    return `
      <div class="task-row${selectedClass}" draggable="true" onclick="selectTask('${task.id}')" ondblclick="openModal('${task.id}')" data-id="${task.id}"
        ondragstart="startTaskReorder(event,'${task.id}')"
        ondragover="onTaskDragOver(event,'${task.id}')"
        ondrop="dropTaskReorder(event,'${task.id}')"
        ondragend="endTaskReorder()">
        <div class="task-color" style="background:${task.color}"></div>
        <div class="task-meta" title="${escapeHtml(task.name)} | ${escapeHtml(task.application)} | ${escapeHtml(releaseLabel)} | ${escapeHtml(ccLabel)}">
          <span class="task-name">${escapeHtml(task.name)}</span>
          <span class="task-badge">${escapeHtml(ccLabel)}</span>
        </div>
        <div class="task-date">${formatShort(task.start)}</div>
        <div class="task-date">${formatShort(task.end)}</div>
      </div>`;
  }).join('');
}

function formatShort(s) { const d=parseDate(s); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}); }

function updateSelectedTaskRowUI() {
  document.querySelectorAll('.task-row.selected').forEach(row => row.classList.remove('selected'));
  if (!selectedTaskId) return;
  const row = document.querySelector(`.task-row[data-id="${selectedTaskId}"]`);
  if (row) row.classList.add('selected');
}

function selectTask(taskId) {
  selectedTaskId = taskId;
  focusedTaskId = taskId;
  updateSelectedTaskRowUI();
  focusGanttBar(taskId);
}

// Stores the task lists for KPI drill-down, keyed by drill ID
const _kpiDrillData = {};

function renderKpis(visibleTasks) {
  const el = document.getElementById('kpiBar');
  if (!el) return;
  const today = new Date(); today.setHours(0,0,0,0);

  const doneTasks = [], lateTasks = [], activeTasks = [], pendingTasks = [];
  let totalDur = 0, weightedProg = 0, etpTotal = 0, joRestants = 0;
  const teamsSet = new Set();

  visibleTasks.forEach(t => {
    teamsSet.add(t.application);
    const s = parseDate(t.start), e = parseDate(t.end);
    const dur = Math.max(1, daysBetween(s, e) + 1);
    totalDur += dur;
    weightedProg += dur * t.progress;
    if (t.etp !== null) etpTotal += t.etp;
    if (t.progress === 100) {
      doneTasks.push(t);
    } else {
      if (e < today) lateTasks.push(t);
      else if (s <= today && e >= today) activeTasks.push(t);
      else if (s > today) pendingTasks.push(t);
      const completedDays = Math.floor(dur * t.progress / 100);
      const remStart = new Date(s); remStart.setDate(remStart.getDate() + completedDays);
      if (remStart <= e) joRestants += countWorkingDays(remStart, e);
    }
  });

  const avgProgress = totalDur > 0 ? Math.round(weightedProg / totalDur) : 0;
  const teamsCount = teamsSet.size;

  // Store drill data for click handlers
  _kpiDrillData['avancement']  = { label: 'Avancement — toutes les tâches', list: [...visibleTasks].sort((a,b) => a.progress - b.progress) };
  _kpiDrillData['terminees']   = { label: 'Terminées', list: doneTasks };
  _kpiDrillData['en-cours']    = { label: 'En cours', list: activeTasks };
  _kpiDrillData['en-retard']   = { label: 'En retard', list: lateTasks };
  _kpiDrillData['non-demarrees'] = { label: 'Non démarrées', list: pendingTasks };

  const kpis = [
    { label:'Tâches',         value: visibleTasks.length, cls: '',                      drill: null },
    { label:'Teams',          value: teamsCount,           cls: '',                      drill: null },
    { label:'Avancement',     value: avgProgress+'%',      cls: avgProgress===100?'kpi-green':avgProgress>=70?'kpi-blue':avgProgress>=40?'kpi-orange':'', drill: 'avancement' },
    { label:'Terminées',      value: doneTasks.length,     cls: doneTasks.length>0?'kpi-green':'',   drill: 'terminees' },
    { label:'En cours',       value: activeTasks.length,   cls: activeTasks.length>0?'kpi-blue':'',  drill: 'en-cours' },
    { label:'En retard',      value: lateTasks.length,     cls: lateTasks.length>0?'kpi-red':'',     drill: 'en-retard' },
    { label:'Non démarrées',  value: pendingTasks.length,  cls: '',                      drill: 'non-demarrees' },
    { label:'ETP total',      value: etpTotal>0?etpTotal.toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:1}):'—', cls: '', drill: null },
    { label:'JO restants',    value: joRestants,           cls: joRestants>0?'kpi-orange':'',        drill: null },
  ];

  el.innerHTML = kpis.map(k => {
    const clickable = k.drill ? ` kpi-clickable" onclick="openKpiDrill('${k.drill}')` : '';
    return `<div class="kpi-item${clickable}"><span class="kpi-label">${k.label}</span><span class="kpi-value${k.cls?' '+k.cls:''}">${k.value}</span></div>`;
  }).join('');
}

function openKpiDrill(drillId) {
  const data = _kpiDrillData[drillId];
  if (!data) return;
  const overlay = document.getElementById('kpiDrillOverlay');
  document.getElementById('kpiDrillTitle').textContent = data.label;
  document.getElementById('kpiDrillCount').textContent = `(${data.list.length} tâche${data.list.length !== 1 ? 's' : ''})`;

  // Apply drill filter to show only these tasks in the gantt
  drillFilterTaskIds.clear();
  data.list.forEach(t => drillFilterTaskIds.add(t.id));
  render();

  const body = document.getElementById('kpiDrillBody');
  if (!data.list.length) {
    body.innerHTML = '<div class="kpi-drill-empty">Aucune tâche dans cette catégorie.</div>';
  } else {
    body.innerHTML = data.list.map(t => {
      const progColor = t.progress === 100 ? '#06d6a0' : t.progress >= 70 ? '#00b4d8' : t.progress >= 30 ? '#ffd166' : '#e94560';
      const cc = escapeHtml(t.cc || 'Sans CC');
      const team = escapeHtml(t.application || 'Sans application');
      return `<div class="kpi-drill-row" onclick="focusGanttBar('${t.id}')" ondblclick="openModal('${t.id}')"
          title="Cliquer pour mettre en focus, double-cliquer pour modifier">
        <div class="kpi-drill-dot" style="background:${t.color}"></div>
        <div>
          <div class="kpi-drill-name">${escapeHtml(t.name)}</div>
          <div class="kpi-drill-meta">${team} · ${cc}${t.porteur ? ' · ' + escapeHtml(t.porteur) : ''}</div>
        </div>
        <div class="kpi-drill-right">
          <div class="kpi-drill-text">
            <div class="kpi-drill-prog" style="color:${progColor}">${t.progress}%</div>
            <div class="kpi-drill-dates">${formatShort(t.start)} → ${formatShort(t.end)}</div>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  overlay.classList.add('active');
}

function closeKpiDrill() {
  document.getElementById('kpiDrillOverlay').classList.remove('active');
  
  // Clear drill filter and rerender to show all tasks again
  drillFilterTaskIds.clear();
  render();
}

function focusGanttBar(taskId) {
  // Clear previous focus
  document.querySelectorAll('.gantt-bar.focused-kpi').forEach(b => b.classList.remove('focused-kpi'));
  focusedTaskId = taskId;

  // Find and focus the bar
  const bar = document.querySelector(`.gantt-bar[data-id="${taskId}"]`);
  if (!bar) return;

  // Scroll to center the bar horizontally and vertically
  const ganttPanel = document.getElementById('ganttPanel');
  const drillPanel = document.getElementById('kpiDrillOverlay').classList.contains('active') ? document.getElementById('kpiDrillPanel') : null;
  const barRect = bar.getBoundingClientRect();
  const panelRect = ganttPanel.getBoundingClientRect();
  const obstructedWidth = drillPanel ? drillPanel.offsetWidth : 0;
  const visibleWidth = Math.max(120, panelRect.width - obstructedWidth);

  // Horizontal scroll: center the bar in the visible area left of the drill panel
  const barCenterX = barRect.left + barRect.width / 2 - panelRect.left;
  const newScrollLeft = ganttPanel.scrollLeft + barCenterX - visibleWidth / 2;
  ganttPanel.scrollLeft = Math.max(0, newScrollLeft);

  // Vertical scroll: center the bar
  const barCenterY = barRect.top + barRect.height / 2 - panelRect.top;
  const newScrollTop = ganttPanel.scrollTop + barCenterY - panelRect.height / 2;
  ganttPanel.scrollTop = Math.max(0, newScrollTop);

  // Add focus class
  bar.classList.add('focused-kpi');
}

function renderGantt(rows, visibleTasks, taskIndexMap) {
  const range = getRange(visibleTasks);
  const days = daysBetween(range.start, range.end) + 1;
  const totalWidth = days * cellWidth;
  const today = new Date(); today.setHours(0,0,0,0);

  // Header
  const header = document.getElementById('ganttHeader');
  let monthRow = '', dayRow = '';
  let curMonth = -1;
  let monthSpan = 0, monthLabel = '';

  for (let i = 0; i < days; i++) {
    const d = new Date(range.start);
    d.setDate(d.getDate() + i);
    const isWeekend = d.getDay() === 0 || d.getDay() === 6;
    const isToday = d.getTime() === today.getTime();

    if (d.getMonth() !== curMonth) {
      if (curMonth !== -1) monthRow += `<div class="gantt-header-cell" style="width:${monthSpan*cellWidth}px;font-weight:600">${monthLabel}</div>`;
      curMonth = d.getMonth();
      monthLabel = d.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
      monthSpan = 0;
    }
    monthSpan++;

    const cls = ['gantt-header-cell'];
    if (isWeekend) cls.push('weekend');
    if (isToday) cls.push('today');

    let label = '';
    if (zoomMode === 'day' || zoomMode === 'week') label = d.getDate();
    else if (i % 7 === 0) label = d.getDate();

    dayRow += `<div class="${cls.join(' ')}" style="width:${cellWidth}px">${label}</div>`;
  }
  monthRow += `<div class="gantt-header-cell" style="width:${monthSpan*cellWidth}px;font-weight:600">${monthLabel}</div>`;

  header.innerHTML = `<div class="gantt-header-row">${monthRow}</div><div class="gantt-header-row">${dayRow}</div>`;

  // Body
  const body = document.getElementById('ganttBody');
  body.style.width = totalWidth + 'px';
  let html = '';

  // Single shared grid background — replaces per-row cells (O(days) instead of O(days x rows))
  let gridHtml = '<div class="gantt-grid-bg">';
  for (let i = 0; i < days; i++) {
      const d = new Date(range.start); d.setDate(d.getDate() + i);
      const isWeekend = d.getDay() === 0 || d.getDay() === 6;
      const isToday = d.getTime() === today.getTime();
      let cls = 'gantt-grid-col';
      if (isWeekend) cls += ' weekend';
      if (isToday) cls += ' today';
      gridHtml += `<div class="${cls}" style="left:${i * cellWidth}px;width:${cellWidth}px"></div>`;
  }
  gridHtml += '</div>';
  html += gridHtml;

  // Grid rows — empty, visual background handled by gantt-grid-bg above
  rows.forEach(row => {
      if (row.type === 'group') {
        const releaseGroupClass = groupBy === 'release' ? ' gantt-group-release-row' : '';
        html += `<div class="gantt-group-row${releaseGroupClass}"><span class="gantt-group-label">${escapeHtml(row.label)}</span></div>`;
        return;
      }
      html += `<div class="gantt-row" data-id="${row.task.id}"></div>`;
  });

  // Dependencies
  html += `<svg class="dependency-layer" width="${totalWidth}" height="${rows.length * ROW_HEIGHT}" viewBox="0 0 ${totalWidth} ${rows.length * ROW_HEIGHT}" preserveAspectRatio="none">
    <defs>
      <marker id="depArrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M 0 1 L 7 4 L 0 7 Z" fill="rgba(255,200,50,0.95)"></path>
      </marker>
    </defs>
    ${renderDependencyPaths(range, taskIndexMap, visibleTasks)}
  </svg>`;

  // Bars overlay
  html += '<div class="gantt-bar-container">';
  rows.forEach((row, idx) => {
    if (row.type === 'group') {
      const top = idx * ROW_HEIGHT + 7;
      html += buildGroupSummaryBar(row, range, top);
      return;
    }

    if (row.type !== 'task') return;

    const t = row.task;
    const s = parseDate(t.start), e = parseDate(t.end);
    const left = daysBetween(range.start, s) * cellWidth;
    const width = (daysBetween(s, e) + 1) * cellWidth;
    const top = idx * ROW_HEIGHT + 7;
    let dragClass = '';
    if (dragState && dragState.id === t.id) {
      dragClass = dragState.mode === 'reorder' ? ' dragging-reorder' : (dragState.mode === 'resize-right' || dragState.mode === 'resize-left') ? ' dragging-time' : '';
    }
    const ccLabel = t.cc || 'Sans CC';
    // Extension rouge persistante si end > plannedEnd
    let extensionHtml = '';
    const progressRatio = Math.max(0, Math.min(100, t.progress)) / 100;
    const progressPx = width * progressRatio;
    const plannedEndDate = parseDate(t.plannedEnd || t.end);
    const curEndDate = parseDate(t.end);
    if (curEndDate > plannedEndDate) {
      const origRightX = (daysBetween(range.start, plannedEndDate) + 1) * cellWidth;
      const extLeft = origRightX - left;
      const extWidth = (daysBetween(range.start, curEndDate) + 1) * cellWidth - origRightX;
      if (extWidth > 0) {
        const overlapWidth = Math.max(0, Math.min(progressPx, extLeft + extWidth) - extLeft);
        const progressOverlay = overlapWidth > 0 ? `<div class="bar-extension-progress" style="width:${overlapWidth}px"></div>` : '';
        extensionHtml = `<div class="bar-extension" style="left:${extLeft}px;width:${extWidth}px">${progressOverlay}</div>`;
      }
    }

    let remainingDaysHtml = '';
    const totalDays = daysBetween(s, e) + 1;
    const completedDays = Math.floor(totalDays * progressRatio);
    const nonProgressWidth = width - progressPx;
    if (showRemainingJo && completedDays < totalDays && nonProgressWidth >= 34) {
      const remainingStart = new Date(s);
      remainingStart.setDate(remainingStart.getDate() + completedDays);
      const remainingWorkDays = countWorkingDays(remainingStart, e);
      if (remainingWorkDays > 0) {
        const label = `${remainingWorkDays} JO`;
        remainingDaysHtml = `<div class="bar-remaining-days">${label}</div>`;
      }
    }

    const focusClass = focusedTaskId === t.id ? ' focused-kpi' : '';
    html += `<div class="gantt-bar${dragClass}${focusClass}" data-id="${t.id}" style="left:${left}px;top:${top}px;width:${width}px;background:${t.color}"
      onmouseenter="showTaskTooltip(event,'${t.id}')"
      onmousemove="moveTaskTooltip(event)"
      onmouseleave="hideTaskTooltip()"
      ondblclick="openModal('${t.id}')">
      <div class="bar-progress" style="width:${t.progress}%"></div>
      ${remainingDaysHtml}
      <div class="reorder-handle" onmousedown="event.stopPropagation();startDrag(event,'${t.id}','reorder')">::</div>
      <div class="resize-handle left" onmousedown="event.stopPropagation();startDrag(event,'${t.id}','resize-left')"></div>
      <div class="resize-handle right" onmousedown="event.stopPropagation();startDrag(event,'${t.id}','resize-right')"></div>
      <div class="bar-link-handle" onmousedown="event.stopPropagation();startLinkDrag(event,'${t.id}')"></div>
      ${extensionHtml}
      <span class="bar-title">${escapeHtml(t.name)}</span>
    </div>`;
  });
  html += '</div>';

  // Jalons
  rows.forEach((row, idx) => {
    if (row.type !== 'task') return;
    const t = row.task;
    if (!t.milestones || !t.milestones.length) return;
    t.milestones.forEach(m => {
      if (!m.date) return;
      const mLeft = daysBetween(range.start, parseDate(m.date)) * cellWidth + cellWidth / 2 - 7;
      const mTop = idx * ROW_HEIGHT + 24;
      html += `<div class="milestone-marker" style="left:${mLeft}px;top:${mTop}px" data-mname="${escapeHtml(m.name)}" data-mdate="${escapeHtml(m.date)}" onmousedown="startMilestoneDrag(event,'${t.id}','${m.id}')" onmouseenter="showMilestoneTooltip(event,this)" onmousemove="moveTaskTooltip(event)" onmouseleave="hideTaskTooltip()"></div>`;
    });
  });

  // Today line
  const todayOff = daysBetween(range.start, today);
  if (todayOff >= 0 && todayOff <= days) {
    html += `<div class="today-line" style="left:${todayOff*cellWidth + cellWidth/2}px;height:${rows.length * ROW_HEIGHT}px"></div>`;
  }

  body.innerHTML = html;

  if (pendingBarAnimation) {
    animateGanttBarReorder(pendingBarAnimation);
    pendingBarAnimation = null;
  }
}

function renderDependencyPaths(range, taskIndexMap, visibleTasks) {
  const R = 6; // corner radius
  const taskById = new Map(tasks.map(task => [task.id, task]));

  return visibleTasks.flatMap(task => {
    const targetRowIndex = taskIndexMap.get(task.id);
    if (targetRowIndex === undefined) return [];

    return task.dependencies.map(depId => {
      const sourceTask = taskById.get(depId);
      const sourceRowIndex = taskIndexMap.get(depId);
      if (!sourceTask || sourceRowIndex === undefined) return '';

      const sourceEndX = (daysBetween(range.start, parseDate(sourceTask.end)) + 1) * cellWidth;
      const targetStartX = daysBetween(range.start, parseDate(task.start)) * cellWidth;
      const sourceY = sourceRowIndex * ROW_HEIGHT + ROW_HEIGHT / 2;
      const targetY = targetRowIndex * ROW_HEIGHT + ROW_HEIGHT / 2;
      const elbowX = Math.max(sourceEndX + 16, targetStartX - 16);
      const dy = targetY - sourceY;

      let d;
      if (Math.abs(dy) < 4) {
        // Same row — straight horizontal line
        d = `M ${sourceEndX} ${sourceY} H ${targetStartX}`;
      } else {
        const signY = dy > 0 ? 1 : -1;
        const r = Math.min(R, Math.abs(dy) / 2, Math.abs(elbowX - sourceEndX) / 2);
        d = [
          `M ${sourceEndX} ${sourceY}`,
          `H ${elbowX - r}`,
          `Q ${elbowX} ${sourceY} ${elbowX} ${sourceY + r * signY}`,
          `V ${targetY - r * signY}`,
          `Q ${elbowX} ${targetY} ${elbowX + r} ${targetY}`,
          `H ${targetStartX}`,
        ].join(' ');
      }

      const dot = `<circle class="dependency-dot" cx="${sourceEndX}" cy="${sourceY}" r="3"/>`;
      return dot + `<path class="dependency-path" marker-end="url(#depArrow)" d="${d}"/>`;
    });
  }).join('');
}

function getTaskById(id) {
  return tasks.find(task => task.id === id) || null;
}

function buildTaskTooltipHtml(task) {
  const ccLabel = task.cc || 'Sans CC';
  const porteurLabel = task.porteur || 'Non renseigné';
  const releaseLabel = task.release || 'Sans release';
  const priorityLabel = task.priority || 'P3';
  const statusLabel = task.status || 'Non renseigné';
  const etpLabel = task.etp === null ? 'Non renseigné' : String(task.etp).replace('.', ',');
  const deps = task.dependencies
    .map(depId => getTaskById(depId))
    .filter(Boolean)
    .map(dep => dep.name);
  const depsLabel = deps.length ? escapeHtml(deps.join(', ')) : 'Aucune';
  return `
    <div class="tt-title">${escapeHtml(task.name)}</div>
    <div class="tt-line"><strong>Team RS/TL:</strong> ${escapeHtml(task.application)}</div>
    <div class="tt-line"><strong>Release:</strong> ${escapeHtml(releaseLabel)}</div>
    <div class="tt-line"><strong>CC:</strong> ${escapeHtml(ccLabel)}</div>
    <div class="tt-line"><strong>Lead:</strong> ${escapeHtml(porteurLabel)}</div>
    <div class="tt-line"><strong>Priorité:</strong> ${escapeHtml(priorityLabel)}</div>
    <div class="tt-line"><strong>Statut:</strong> ${escapeHtml(statusLabel)}</div>
    <div class="tt-line"><strong>ETP:</strong> ${escapeHtml(etpLabel)}</div>
    <div class="tt-line"><strong>Début:</strong> ${escapeHtml(task.start)}</div>
    <div class="tt-line"><strong>Fin:</strong> ${escapeHtml(task.end)}</div>
    <div class="tt-line"><strong>Progression:</strong> ${task.progress}%</div>
    <div class="tt-line"><strong>Dépendances:</strong> ${depsLabel}</div>
  `;
}

function showTaskTooltip(event, taskId) {
  const task = getTaskById(taskId);
  const tooltip = document.getElementById('taskTooltip');
  if (!task || !tooltip) return;
  tooltipTaskId = taskId;
  tooltip.innerHTML = buildTaskTooltipHtml(task);
  tooltip.classList.add('visible');
  moveTaskTooltip(event);
}

function moveTaskTooltip(event) {
  const tooltip = document.getElementById('taskTooltip');
  if (!tooltip || !tooltipTaskId) return;

  const offset = 14;
  const rect = tooltip.getBoundingClientRect();
  let x = event.clientX + offset;
  let y = event.clientY + offset;

  if (x + rect.width > window.innerWidth - 8) x = event.clientX - rect.width - offset;
  if (y + rect.height > window.innerHeight - 8) y = event.clientY - rect.height - offset;
  if (x < 8) x = 8;
  if (y < 8) y = 8;

  tooltip.style.left = `${x}px`;
  tooltip.style.top = `${y}px`;
}

function hideTaskTooltip() {
  const tooltip = document.getElementById('taskTooltip');
  if (!tooltip) return;
  tooltipTaskId = null;
  tooltip.classList.remove('visible');
}

// ── Drag & Drop ──
function startDrag(e, id, mode) {
  if (mode === 'move') return;
  hideTaskTooltip();
  e.preventDefault();
  const task = tasks.find(t => t.id === id);
  if (!task) return;
  dragState = {
    id,
    mode,
    startX: e.clientX,
    startY: e.clientY,
    origStart: task.start,
    origEnd: task.end,
    origProgress: task.progress,
    origIndex: tasks.findIndex(t => t.id === id),
  };
  document.addEventListener('mousemove', onDrag);
  document.addEventListener('mouseup', endDrag);
  render();
}

function onDrag(e) {
  if (!dragState) return;
  const dx = e.clientX - dragState.startX;
  const dayDelta = Math.round(dx / cellWidth);
  const task = tasks.find(t => t.id === dragState.id);
  if (!task) return;

  const origS = parseDate(dragState.origStart);
  const origE = parseDate(dragState.origEnd);

  if (dragState.mode === 'reorder') {
    reorderTaskFromBarDrag(e.clientY);
    render();
  } else if (dragState.mode === 'resize-right') {
    const ne = new Date(origE); ne.setDate(ne.getDate()+dayDelta);
    if (ne >= origS) {
      task.end = fmt(ne);
      const joTotal = countWorkingDays(origS, ne);
      if (joTotal > 0) {
        const joRealises = Math.round(dragState.origProgress / 100 * countWorkingDays(origS, origE));
        task.progress = Math.min(100, Math.round(joRealises / joTotal * 100));
      }
    }
    updateDraggedBarDOM();
  } else if (dragState.mode === 'resize-left') {
    const ns = new Date(origS); ns.setDate(ns.getDate()+dayDelta);
    if (ns <= origE) task.start = fmt(ns);
    updateDraggedBarDOM();
  }
}

function updateDraggedBarDOM() {
  const task = tasks.find(t => t.id === dragState.id);
  if (!task) return;
  const bar = document.querySelector(`.gantt-bar[data-id="${dragState.id}"]`);
  if (!bar) return;

  const range = getRange(getVisibleTasks());
  const s = parseDate(task.start);
  const e = parseDate(task.end);
  const left = daysBetween(range.start, s) * cellWidth;
  const width = (daysBetween(s, e) + 1) * cellWidth;

  bar.style.left = left + 'px';
  bar.style.width = width + 'px';

  // Progress bar
  const progressBar = bar.querySelector('.bar-progress');
  if (progressBar) progressBar.style.width = task.progress + '%';

  // Remaining days badge
  const progressRatio = Math.max(0, Math.min(100, task.progress)) / 100;
  const progressPx = width * progressRatio;
  const totalDays = daysBetween(s, e) + 1;
  const completedDays = Math.floor(totalDays * progressRatio);
  const nonProgressWidth = width - progressPx;
  let remainingBadge = bar.querySelector('.bar-remaining-days');
  if (showRemainingJo && completedDays < totalDays && nonProgressWidth >= 34) {
    const remStart = new Date(s); remStart.setDate(remStart.getDate() + completedDays);
    const remWorkDays = countWorkingDays(remStart, e);
    if (remWorkDays > 0) {
      if (!remainingBadge) {
        remainingBadge = document.createElement('div');
        remainingBadge.className = 'bar-remaining-days';
        bar.insertBefore(remainingBadge, bar.querySelector('.reorder-handle').nextSibling);
      }
      remainingBadge.textContent = `${remWorkDays} JO`;
    } else if (remainingBadge) { remainingBadge.remove(); }
  } else if (remainingBadge) { remainingBadge.remove(); }

  // Extension rouge
  const plannedEnd = parseDate(task.plannedEnd || task.end);
  let ext = bar.querySelector('.bar-extension');
  if (e > plannedEnd) {
    const origRightX = (daysBetween(range.start, plannedEnd) + 1) * cellWidth;
    const extLeft = origRightX - left;
    const extWidth = (daysBetween(range.start, e) + 1) * cellWidth - origRightX;
    if (extWidth > 0) {
      if (!ext) { ext = document.createElement('div'); ext.className = 'bar-extension'; bar.appendChild(ext); }
      ext.style.left = extLeft + 'px';
      ext.style.width = extWidth + 'px';
    }
  } else if (ext) { ext.remove(); }

  // Task list row dates
  const taskRow = document.querySelector(`.task-row[data-id="${dragState.id}"]`);
  if (taskRow) {
    const dateCells = taskRow.querySelectorAll('.task-date');
    if (dateCells[0]) dateCells[0].textContent = formatShort(task.start);
    if (dateCells[1]) dateCells[1].textContent = formatShort(task.end);
  }
}

function endDrag() {
  if (dragState) {
    if (dragState.mode === 'resize-right') {
      const task = tasks.find(t => t.id === dragState.id);
      if (task) {
        const delta = daysBetween(parseDate(dragState.origEnd), parseDate(task.end));
        if (delta > 0) cascadeDependentTasks(dragState.id, delta);
      }
    }
    saveTasks();
    dragState = null;
    render();
  }
  document.removeEventListener('mousemove', onDrag);
  document.removeEventListener('mouseup', endDrag);
}

function reorderTaskFromBarDrag(pointerY) {
  if (!dragState || dragState.mode !== 'reorder') return;

  const body = document.getElementById('ganttBody');
  const bodyRect = body.getBoundingClientRect();
  const draggedTask = tasks.find(task => task.id === dragState.id);
  const currentIndex = tasks.findIndex(t => t.id === dragState.id);
  const rows = getGroupedVisibleRows();
  const relativeY = pointerY - bodyRect.top;
  const hoveredRow = rows[Math.max(0, Math.min(rows.length - 1, Math.floor(relativeY / ROW_HEIGHT)))];
  if (!draggedTask || !hoveredRow || hoveredRow.type !== 'task') return;

  const targetTask = hoveredRow.task;
  if (!sameGroupingBucket(draggedTask, targetTask)) return;
  const targetIndex = tasks.findIndex(t => t.id === targetTask.id);

  if (targetIndex === currentIndex || currentIndex === -1) return;

  pendingBarAnimation = captureGanttBarPositions();
  const [movingTask] = tasks.splice(currentIndex, 1);
  tasks.splice(targetIndex, 0, movingTask);
}

function captureGanttBarPositions() {
  const positions = new Map();
  document.querySelectorAll('.gantt-bar').forEach(bar => {
    positions.set(bar.dataset.id, bar.getBoundingClientRect().top);
  });
  return positions;
}

function animateGanttBarReorder(previousPositions) {
  document.querySelectorAll('.gantt-bar').forEach(bar => {
    const previousTop = previousPositions.get(bar.dataset.id);
    if (previousTop === undefined) return;

    const newTop = bar.getBoundingClientRect().top;
    const deltaY = previousTop - newTop;
    if (!deltaY) return;

    bar.classList.add('reorder-animating');
    bar.style.transition = 'none';
    bar.style.transform = `translateY(${deltaY}px)`;
    bar.getBoundingClientRect();
    bar.style.transition = '';

    requestAnimationFrame(() => {
      bar.style.transform = 'translateY(0)';
    });

    const cleanup = () => {
      bar.classList.remove('reorder-animating');
      bar.style.transform = '';
      bar.style.transition = '';
      bar.removeEventListener('transitionend', cleanup);
    };

    bar.addEventListener('transitionend', cleanup);
  });
}

// ── Task reorder ──
function startTaskReorder(e, id) {
  reorderState = { draggedId: id, targetId: null, placement: 'after' };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', id);
  requestAnimationFrame(() => {
    const row = document.querySelector(`.task-row[data-id="${id}"]`);
    if (row) row.classList.add('dragging');
  });
}

function onTaskDragOver(e, id) {
  if (!reorderState || reorderState.draggedId === id) return;
  e.preventDefault();

  const row = e.currentTarget;
  const draggedTask = tasks.find(task => task.id === reorderState.draggedId);
  const targetTask = tasks.find(task => task.id === id);
  if (!sameGroupingBucket(draggedTask, targetTask)) return;
  const rect = row.getBoundingClientRect();
  const placement = e.clientY < rect.top + rect.height / 2 ? 'before' : 'after';

  reorderState.targetId = id;
  reorderState.placement = placement;
  updateDropIndicators();
}

function onTaskListDragOver(e) {
  if (!reorderState) return;
  e.preventDefault();

  const list = e.currentTarget;
  const lastRow = list.querySelector('.task-row:last-child');
  if (!lastRow) return;

  const draggedTask = tasks.find(task => task.id === reorderState.draggedId);
  const targetTask = tasks.find(task => task.id === lastRow.dataset.id);
  if (!sameGroupingBucket(draggedTask, targetTask)) return;

  const rect = lastRow.getBoundingClientRect();
  if (e.clientY >= rect.top + rect.height / 2) {
    reorderState.targetId = lastRow.dataset.id;
    reorderState.placement = 'after';
    updateDropIndicators();
  }
}

function dropTaskReorder(e, id) {
  e.preventDefault();
  if (!reorderState || reorderState.draggedId === id) {
    endTaskReorder();
    return;
  }

  const row = e.currentTarget;
  const rect = row.getBoundingClientRect();
  const placement = e.clientY < rect.top + rect.height / 2 ? 'before' : 'after';
  moveTask(reorderState.draggedId, id, placement);
